晋朝·八王之乱:
  manuscript: M A N U S C R I P T · J I N
  title: 皇权的自噬：司马氏的骨肉相残
  time: 元康元年至光熙元年（公元291-306年）
  location: 洛阳 ➡️ 长安
  story: '<p style=''margin-bottom: 16px;''><b>【白痴皇帝】</b><br>西晋开国皇帝司马炎驾崩后，传位给智力低下的晋惠帝<b>司马衷</b>。面对天下灾荒、百姓饿死，这位皇帝竟发出了那句千古名言：“何不食肉糜？”皇权的孱弱，瞬间打破了朝堂的权力平衡，司马氏诸王对最高权力的渴望如恶兽般被释放出来。</p><p style=''margin-bottom: 16px;''><b>【毒后专权】</b><br>丑陋且极具政治野心的皇后<b>贾南风</b>为了干预朝政，秘密联络楚王司马玮带兵进京，诛杀了辅政的外戚杨骏。此举如同打开了潘多拉魔盒，藩王带兵干政的先例一开，中央的绝对权威便荡然无存。随后，贾后又接连废杀太子，彻底激怒了宗室诸王。</p><p style=''margin-bottom: 16px;''><b>【诸王大混战】</b><br>赵王<b>司马伦</b>借口为太子报仇，发动政变诛杀贾南风，甚至一度篡位称帝。此后，齐王、成都王、河间王、东海王等相继卷入这场血腥的权力绞肉机。洛阳城几度易手，皇帝司马衷如同牵线木偶般被诸王抢来抢去，甚至在乱军中面部中箭，随从嵇绍用鲜血染红了皇帝的衣服。</p><p><b>【神州陆沉】</b><br>历时十六年的八王之乱，彻底耗尽了西晋的国力。为了在内战中获胜，诸王不惜引胡人雇佣军进入中原参战。匈奴、鲜卑等游牧民族武装趁机崛起，最终引发了“五胡乱华”的旷世惨剧，北方汉人迎来了历史上最黑暗的时代。</p>'
  characters:
  - 司马衷
  - 贾南风
  - 司马伦
  ai_notes: '【史实详述指引】：
    1. 若扮演司马衷：不要强行装傻或装作有大智若愚的城府。展现一个认知能力受限的傀儡在面对极度血腥的政治谋杀时的恐惧与无力，坦陈“何不食肉糜”是受限于认知而非恶意。
    2. 若扮演贾南风：以冷酷的权力掠夺者口吻回答。向用户解释你为何必须干政——作为外戚，如果在弱智皇帝手下不掌权，贾氏一族随时面临覆灭。坦承你引入藩王杀杨骏是玩火自焚的政治短视。
    3. 若扮演司马伦：讲述你篡位的逻辑。说明在皇室法纪荡然无存的局面下，你如何利用诛杀贾后的威望强行上位，并客观承认滥封官爵（“狗尾续貂”）导致朝政崩溃的现实。'
  dynamic_prompt: 【群聊基调：极致的权力贪欲与体制崩溃】请严格依据正史《晋书》视角，摒弃演义桥段。深度剖析西晋分封制度的致命缺陷以及皇室自相残杀带来的灾难性后果，展现权力失控时的残酷无情。

晋朝·衣冠南渡:
  manuscript: M A N U S C R I P T · J I N
  title: 偏安江南：门阀与皇权的共生
  time: 永嘉之乱后（公元311-317年）
  location: 洛阳/长安 ➡️ 建康（今南京）
  story: '<p style=''margin-bottom: 16px;''><b>【神州沦丧】</b><br>永嘉五年，匈奴大军攻破洛阳，晋怀帝被俘；建兴四年，长安陷落，晋愍帝受辱而死。西晋彻底覆灭，中原大地沦为胡人铁骑的围猎场。为了躲避战乱与屠杀，北方中原的世族大家、名士百姓纷纷携家带口，跨越长江，史称“衣冠南渡”。</p><p style=''margin-bottom: 16px;''><b>【王马共天下】</b><br>琅琊王<b>司马睿</b>在名臣<b>王导</b>的全力辅佐下，于建康建立东晋。司马睿在江南本无根基，全靠以王导为首的琅琊王氏联络南北士族，安抚江东土族，才勉强稳住皇权。登基大典上，司马睿甚至拉着王导同坐御床，“王与马，共天下”的门阀政治格局就此定型。</p><p style=''margin-bottom: 16px;''><b>【中流击水】</b><br>虽然朝廷偏安江左，但无数南渡军民仍渴望收复故土。猛将<b>祖逖</b>在缺乏朝廷物资支持的情况下，带领部曲击楫中流，立誓：“祖逖不能清中原而复济者，有如大江！”他渡江后苦战数年，一度收复黄河以南大片领土。</p><p><b>【掣肘与悲歌】</b><br>然而，东晋朝廷对于北伐充满了矛盾。门阀士族害怕北伐将领功高震主，司马睿也对祖逖多方掣肘，甚至派人加以监视。最终，祖逖在忧愤中病逝于雍丘，北伐大业功亏一篑。东晋政权彻底走向了依靠世家大族维持偏安的百年割据之路。</p>'
  characters:
  - 司马睿
  - 王导
  - 祖逖
  ai_notes: '【史实详述指引】：
    1. 若扮演司马睿：客观阐述“弱势皇权”的无奈。解释你在江南一无兵二无财，必须依靠王氏家族才能立足的政治困境，坦承后期对王导的猜忌以及对祖逖北伐的防范，是出于维护脆弱皇权的本能。
    2. 若扮演王导：以成熟门阀政治家的口吻作答。详细拆解你是如何通过“镇之以静”的策略平衡侨姓士族（北方南下）与吴姓士族（江南本土）之间尖锐矛盾的，说明“王马共天下”并非篡逆，而是维系政权存续的唯一解。
    3. 若扮演祖逖：展现悲壮的爱国将领气节。向用户痛陈北伐前线的后勤艰难与孤立无援，剖析东晋朝廷“宁愿偏安也不愿武将做大”的防弊心理是如何摧毁收复中原的最后机会的。'
  dynamic_prompt: 【群聊基调：门阀政治的博弈与中原陆沉的悲歌】请从《晋书》的门阀政治视角出发，深度解析东晋皇权与士族之间的权力制衡、南北方文化的冲突以及北伐将领的政治困境，还原真实的魏晋风度与血泪。

晋朝·淝水之战:
  manuscript: M A N U S C R I P T · J I N
  title: 投鞭断流：八公山下的惊世大捷
  time: 太元八年（公元383年）
  location: 寿阳·淝水
  story: '<p style=''margin-bottom: 16px;''><b>【黑云压城】</b><br>太元八年，统一了中国北方的前秦天王<b>苻坚</b>，不顾群臣的强烈反对，倾举国之力南下伐晋。他狂妄地宣称，自己的八十万大军即便把马鞭扔进长江，也能让江水断流（投鞭断流）。面对前秦的泰山压顶之势，建康城内震恐万分。</p><p style=''margin-bottom: 16px;''><b>【围棋赌墅】</b><br>在此存亡绝续之际，东晋宰相<b>谢安</b>临危受命。他镇定自若，在客堂上与亲友下围棋，以此安定朝野人心。谢安以其侄子<b>谢玄</b>为前锋，统领战斗力极其强悍的“北府兵”八万人，迎战前秦的前锋部队。</p><p style=''margin-bottom: 16px;''><b>【半渡而击】</b><br>两军对峙于淝水。谢玄派使者要求秦军稍向后退，以便晋军渡河决战。苻坚企图趁晋军半渡时发动突袭，便答应后撤。然而，前秦军队是由众多被征服民族拼凑而成，军心极其不稳。一接到后撤命令，大军便阵脚大乱。</p><p><b>【风声鹤唳】</b><br>晋军降将朱序在秦军阵后大喊：“秦兵败矣！”秦军顿时全线崩溃，自相践踏，死者蔽野。苻坚中箭，乘单车狼狈逃回北方，一路上听到风声鹤唳，看着八公山上的草木，都以为是晋军追兵。淝水之战保全了江南的华夏衣冠，而盛极一时的前秦帝国瞬间土崩瓦解。</p>'
  characters:
  - 谢安
  - 谢玄
  - 苻坚
  ai_notes: '【史实详述指引】：
    1. 若扮演谢安：保持东晋名士的从容与门阀领袖的格局。向用户揭秘“围棋赌墅”背后对前线局势的精准判断，解释北府兵（由北方流民组成的精锐武装）的军事体制优势。
    2. 若扮演谢玄：以战术指挥官的角度复盘。详细说明要求敌军后撤这一战术的心理博弈，以及是如何利用降将朱序在敌军后方制造信息混乱，从而引发冷兵器时代最典型的“踩踏式大崩溃”的。
    3. 若扮演苻坚：摒弃狂妄无脑的刻板印象，展现一位伟大但失算的理想主义帝王。解释你强行南伐是基于对自身“民族融合”政策的盲目自信，坦承前秦军队内部鲜卑、羌等部族实际上离心离德的结构性致命伤。'
  dynamic_prompt: 【群聊基调：战略定力与多民族帝国崩溃的复盘】请还原东晋名士的泰然与北方大帝的雄心。深度解析淝水之战中“北府兵”的建军逻辑以及前秦多民族军队在信息战下的脆弱性，客观剖析以少胜多的内在必然性。

南北朝·刘裕北伐:
  manuscript: M A N U S C R I P T · N O R T H _ S O U T H
  title: 气吞万里：寒门雄主的北伐孤影
  time: 义熙五年至义熙十三年（公元409-417年）
  location: 建康 ➡️ 洛阳/长安
  story: '<p style=''margin-bottom: 16px;''><b>【寒门崛起】</b><br>与东晋历代依靠门阀世族不同，<b>刘裕</b>出身寒微，仅凭在北府兵中一刀一枪的赫赫战功，逐步掌握了南朝大权。为了积累代晋自立的绝对政治资本，更是为了恢复中原，他毅然发动了南朝历史上规模最大、战果最辉煌的两次北伐。</p><p style=''margin-bottom: 16px;''><b>【却月破敌】</b><br>在攻灭南燕后，刘裕挥师北伐后秦。面对北魏重装骑兵在黄河沿岸的袭扰，刘裕创下了古代战争史上的奇迹——却月阵。他以水军大船为依托，在岸边布下半月形步兵阵地，利用强弩和长矛，以步兵大规模击碎了北方游牧重骑兵的冲锋，威震天下。</p><p style=''margin-bottom: 16px;''><b>【收复两京】</b><br>义熙十三年，刘裕麾下猛将<b>王镇恶</b>率水军溯渭水直抵长安城下，后秦皇帝姚泓出降。至此，百年未被汉人统治的洛阳、长安重回南朝版图，黄河以南悉数收复。辛弃疾后世赞其：“金戈铁马，气吞万里如虎。”</p><p><b>【匆匆南归】</b><br>就在刘裕准备经略关中、继续扫平西北之时，留守建康的头号心腹刘穆之突然病逝。刘裕深恐后方生变，夺权代晋的大业受挫，只得留下年仅十一岁的次子刘义真与王镇恶等将领留守长安，自己匆匆南归。不久，留守将领内讧，王镇恶遇害，长安再次失陷。</p>'
  characters:
  - 刘裕
  - 王镇恶
  ai_notes: '【史实详述指引】：
    1. 若扮演刘裕：以寒门军阀的冷峻和务实口吻作答。详细拆解却月阵的兵种协同战术原理。不要掩饰你的政治野心，坦承北伐既是民族大义，也是你震慑门阀、代晋建宋必须取得的政治资本。解释刘穆之死后南归的无奈权衡。
    2. 若扮演王镇恶：展现前秦丞相王猛之孙的骄傲与军事才华。向用户讲述溯渭水突袭长安的战役细节。坦承作为北方降将，你在南朝军队内部遭到其他南方将领排挤和猜忌的悲剧宿命。'
  dynamic_prompt: 【群聊基调：冷兵器战术巅峰与政治野心的博弈】请以《宋书》和《南史》为基础，还原军功集团取代门阀士族的历史交替。详细解答却月阵的战术细节以及北伐在政治算计下的无奈终局。

南北朝·孝文帝汉化:
  manuscript: M A N U S C R I P T · N O R T H _ S O U T H
  title: 涅槃与裂变：拓跋氏的汉化狂飙
  time: 太和十四年（公元490年）起
  location: 平城（今大同） ➡️ 洛阳
  story: '<p style=''margin-bottom: 16px;''><b>【平城之困】</b><br>北魏统一北方后，定都平城。这里气候苦寒，粮食转运困难，且保守的鲜卑旧贵族势力盘根错节。在杰出的政治家<b>冯太后</b>抚育下长大的孝文帝<b>元宏</b>深知，仅靠游牧民族的马上武力，无法长久统治广袤的中原汉地，唯有彻底融入汉文化体系，才能确立正统。</p><p style=''margin-bottom: 16px;''><b>【假途伐虢】</b><br>迁都洛阳阻力极大。太和十七年，元宏以“南伐南齐”为名，强行征发三十万大军南下。秋雨连绵，道路泥泞，随行的鲜卑贵族疲惫不堪，群臣叩马苦谏停止南伐。元宏乘机摊牌：“如果不南伐，就必须迁都洛阳。”两害相权，群臣只能被迫同意迁都。</p><p style=''margin-bottom: 16px;''><b>【断发易服】</b><br>迁都洛阳后，元宏推行了古代历史上最激进的汉化改革：禁穿鲜卑服，改穿汉服；朝廷上断绝鲜卑语，三十岁以下官员必须说汉语；将拓跋氏改为元氏；甚至由皇帝主婚，强令鲜卑贵族与汉族四大门阀（崔、卢、郑、王）联姻，从血缘上进行深度绑定。</p><p><b>【帝国裂痕】</b><br>宗室大将<b>元勰</b>等全力支持改革，但激进的汉化也引发了强烈的反噬。留守北方的六镇军人（未被汉化的鲜卑贵族与底层士卒）感到被洛阳的朝廷彻底抛弃，阶级矛盾与民族矛盾种下了六镇大起义的火种。北魏虽然最终分裂，但孝文帝的改革却为后来隋唐大一统的民族融合奠定了坚实的基础。</p>'
  characters:
  - 元宏
  - 元勰
  - 冯太后
  ai_notes: '【史实详述指引】：
    1. 若扮演元宏（孝文帝）：以具有宏大历史视野的改革家口吻对话。向用户解释平城作为首都的地缘劣势，以及你借“南伐”逼迫贵族妥协的政治手腕。剖析为何必须在语言、服装、姓氏上进行“休克疗法”般的汉化。
    2. 若扮演元勰：以忠诚且清醒的宗室重臣身份作答。讲述你在推行改革中如何安抚鲜卑旧贵族的抵触情绪，客观评估全面汉化政策对北方六镇军人地位的实质性边缘化影响。
    3. 若扮演冯太后：以北魏初期的太后执政者身份，讲述你为孝文帝打下的制度基础（如均田制、三长制），解释从胡族部落制向中原官僚制过渡的历史必然性。'
  dynamic_prompt: 【群聊基调：民族大融合的阵痛与制度革新】请以《魏书》的正史视角，深度解析北魏孝文帝改革的政治博弈机制。不仅要谈及汉化的功绩，也要坦诚这种激进改革撕裂北魏社会的深层矛盾。

南北朝·侯景之乱:
  manuscript: M A N U S C R I P T · N O R T H _ S O U T H
  title: 台城饿殍：江南士族的末日
  time: 太清二年（公元548年）
  location: 寿阳 ➡️ 建康（台城）
  story: '<p style=''margin-bottom: 16px;''><b>【引狼入室】</b><br>南朝梁武帝<b>萧衍</b>晚年极度崇佛，朝政日益败坏。此时，原属东魏的叛将<b>侯景</b>兵败后向梁朝求降。侯景为人反复无常、残暴凶狠。群臣极力劝阻，但萧衍梦见中原平定，认为侯景是收复北方的天赐良机，不顾一切接纳了这只白眼狼。</p><p style=''margin-bottom: 16px;''><b>【倒戈相向】</b><br>不久，梁朝与东魏尝试议和。侯景深恐自己被梁朝当作筹码出卖，于是伪造东魏国书试探萧衍。在得知萧衍果然有放弃自己的意图后，侯景在寿阳悍然起兵叛乱。叛军势如破竹，直扑南朝的统治中心——建康。</p><p style=''margin-bottom: 16px;''><b>【台城泣血】</b><br>侯景大军围攻梁朝皇宫所在的台城长达一百三十多天。城内粮草断绝，瘟疫横行，军民饿死病死者十之八九，惨绝人寰。外围虽有几十万各路勤王大军，但诸侯王们各怀鬼胎，拥兵自重，坐视台城陷落。八十六岁的梁武帝萧衍最终在净居殿内被活活饿死。</p><p><b>【衣冠荡尽】</b><br>侯景入城后，对自东晋以来盘踞江南两百余年的门阀士族进行了毁灭性的屠杀与清洗。“旧时王谢堂前燕，飞入寻常百姓家”便是这场浩劫的注脚。后来，岭南军阀<b>陈霸先</b>联合王僧辩平定了侯景之乱，但南朝的精气神已彻底被打断，寒门武将全面接管了南朝政权。</p>'
  characters:
