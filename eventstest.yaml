  location: 洛阳 ➡️ 辽东
  story: '<p style=''margin-bottom: 16px;''><b>【狂妄的举国之战】</b><br>为了彻底消除东北边患，树立天可汗的绝对权威，<b>隋炀帝杨广</b>决定发动针对高句丽的灭国之战。大业八年，杨广动员了超过一百一十三万的作战部队，加上负责后勤运粮的民夫，总人数高达两三百万。军队首尾相连长达近千公里，这是古代人类历史上规模空前庞大的远征。</p><p style=''margin-bottom: 16px;''><b>【微操与掣肘】</b><br>然而，庞大的军队由于杨广瞎指挥而陷入泥潭。杨广出于极度的控制欲，下令前线将领每次调动、每次接纳高句丽伪降，都必须向大本营请示。这种荒唐的军事“微操”导致隋军屡屡错失战机，数十万大军顿兵于辽东坚城之下，粮草消耗殆尽。</p><p style=''margin-bottom: 16px;''><b>【萨水惨败】</b><br>名将宇文述、于仲文率三十万大军渡过鸭绿江突袭平壤。因后勤断绝，士兵饿着肚子作战，在萨水被高句丽军半渡而击。三十万大军全军覆没，最终逃回辽东的仅剩两千七百余人。大将<b>来护儿</b>率领的水军也因孤军深入而遭重创。</p><p><b>【后院起火】</b><br>杨广不顾国内已经沸腾的民怨，强行发动第二、第三次东征。沉重的兵役和转输劳役彻底压垮了天下百姓，“无向辽东浪死歌”传遍中原。就在第二次东征前线吃紧时，重臣<b>杨玄感</b>在后方黎阳发动叛乱，切断了粮道。大隋帝国的统治中枢彻底崩盘，群雄并起，隋朝在一场场无谓的消耗中走向了灭亡。</p>'
  characters:
