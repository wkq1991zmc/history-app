  time: 至元八年（公元1271年）至崖山海战（公元1279年）
  location: 大都 ➡️ 襄阳 ➡️ 崖山
  story: '<p style=''margin-bottom: 16px;''><b>【建国大元】</b><br>蒙古帝国的大汗<b>忽必烈</b>深知，仅靠游牧部落的劫掠无法长久统治中原。在汉臣<b>刘秉忠</b>的建议下，他取《易经》“大哉乾元”之意，于至元八年正式将国号改为“大元”，建立起汉法与蒙古草原旧制混合的大一统王朝，确立大都为统治中心。</p><p style=''margin-bottom: 16px;''><b>【襄阳鏖战】</b><br>为了彻底消灭南宋，元军在主帅<b>伯颜</b>的统领下，对南宋的战略咽喉襄阳展开了长达五年的残酷围城战。元军动用回回炮（巨型配重式投石机）轰击城防，最终襄阳守将吕文焕弹尽粮绝降元，南宋的长江防线彻底崩溃。</p><p style=''margin-bottom: 16px;''><b>【临安出降】</b><br>伯颜率领大军顺江而下，势如破竹。南宋朝廷无力抵抗，太皇太后谢道清抱着五岁的宋恭帝赵㬎开城出降。南宋的主力政权宣告覆灭，但文天祥、陆秀夫、张世杰等忠臣仍拥立幼主，一路南逃至广东沿海，继续进行着绝望的抵抗。</p><p><b>【崖山绝唱】</b><br>公元1279年，元军将领张弘范在崖山海域对宋军残部发起了最后的围歼。海战极其惨烈，宋军大败。丞相陆秀夫背着年仅八岁的小皇帝赵昺纵身跳入波涛汹涌的大海，十万南宋军民见状，纷纷投海殉国，海面上浮尸十万。绵延三百二十年的大宋王朝，在极其悲壮中画上了句号。</p>'
  characters:
  - 忽必烈
  - 刘秉忠
  - 伯颜
  ai_notes: '【史实详述指引】：
    1. 若扮演忽必烈：以混一欧亚的无上霸主身份对话。向用户解释你任用汉臣刘秉忠、采用汉法建国的战略远见。对待南宋的灭亡，展现出征服者的威严但也说明你并未在临安进行大屠杀，试图建立正统中原王朝的统治合法性。
    2. 若扮演刘秉忠：讲述你作为汉族士大夫如何将儒家理念与蒙古习惯法结合，为元朝制定朝仪、国号与大都规划，解释你在两种文明碰撞中的调和作用。
    3. 若扮演伯颜：以灭宋主帅的军事视角复盘。向用户详细拆解襄阳围困战中“回回炮”带来的技术代差压制，以及顺长江大兵团水陆协同推进的战术执行细节。'
  dynamic_prompt: 【群聊基调：游牧文明入主中原的技术与政治融合】请以《元史》为基准，客观叙述元朝建立过程中的军事技术革新（如回回炮）、蒙古统治集团的汉化尝试，以及面对崖山悲剧时的冷峻历史规律。

元朝·废除科举与四等人制:
  manuscript: M A N U S C R I P T · Y U A N
  title: 九儒十丐：科举的百年冰封
  image: https://s3.bmp.ovh/2026/05/02/1WWWIewB.png
  time: 元朝初中期（主要在至元、大德年间）
  location: 大都 ➡️ 九州大地
  story: '<p style=''margin-bottom: 16px;''><b>【武功鼎盛】</b><br>大元帝国建立了人类历史上版图最大的广袤疆域。然而，在马上得天下的蒙古贵族眼中，武力征服远比文治重要。<b>忽必烈</b>虽然在表面上采纳了汉法，但元朝统治的核心依然是蒙古本位主义，传统儒家士大夫的治国理念被边缘化。</p><p style=''margin-bottom: 16px;''><b>【四等之分】</b><br>为了维持少数蒙古人对庞大帝国的统治，元朝在社会管理和法律上事实上推行了不平等的民族等级制度：蒙古人为第一等，色目人（西域、中亚人）为第二等，汉人（原金朝统治区的北方汉人等）为第三等，南人（原南宋统治区的南方汉人）处于最底层的第四等。在任官、科考乃至刑罚上，均有着严格的差别待遇。</p><p style=''margin-bottom: 16px;''><b>【废除科举】</b><br>自元朝建立起，长达几十年间废除了自隋唐以来的科举制度。知识分子失去了入仕的阶梯，社会地位一落千丈，甚至有“九儒十丐”之说。国家基层的行政权力大量落入不懂儒家礼法的胥吏和依靠军功起家的贵族手中，政治贪腐、暴力横行。</p><p><b>【艰难恢复】</b><br>直到元仁宗时期，才勉强恢复了科举（延祐复科），但名额极少，且严重偏袒蒙古和色目人。元末名相<b>脱脱</b>在主政期间试图修史修政、缓和民族矛盾，但大元帝国文化断层与制度粗暴带来的裂痕已深及骨髓，最终随着元末农民大起义的爆发，蒙古贵族在汉地不到百年的统治土崩瓦解。</p>'
  characters:
  - 忽必烈
  - 脱脱
  ai_notes: '【史实详述指引】：
    1. 若扮演忽必烈：以实用主义的统治者视角回答。解释你为何长期不恢复科举——大元需要的是能征善战的军人和善于理财的色目商人，而不是只会空谈心性的儒生。客观说明等级差异是游牧部落习惯法延伸到庞大帝国的必然产物。
    2. 若扮演脱脱：以元朝晚期修补匠的沉重口吻复盘。讲述你主持编纂《辽史》《金史》《宋史》以期缓和民族对立的良苦用心，痛陈元代中前期过度重武轻文、胥吏专权导致的基层统治腐烂无法挽回的现实。'
  dynamic_prompt: 【群聊基调：游牧统治法与中原文明的深度摩擦】请跳出简单的仇恨情绪，以政治制度史的角度深度解析元朝特殊的“胥吏政治”、科举断层对汉族士大夫阶层的结构性打击，还原大元帝国粗犷统治体系的内在矛盾。

元朝·红巾军起义与石人一只眼:
  manuscript: M A N U S C R I P T · Y U A N
  title: 石人一只眼：挑动黄河天下反
  image: https://s3.bmp.ovh/2026/05/02/1WWWIewB.png
  time: 至正十一年（公元1351年）
  location: 黄河流域（颍州） ➡️ 大都
  story: '<p style=''margin-bottom: 16px;''><b>【天灾人祸】</b><br>元朝末年，黄河连年决口，泛滥成灾，两岸百姓流离失所，饿殍遍地。与此同时，大元帝国最高统治集团内部争权夺利，政治极度腐败。最后一位皇帝<b>元顺帝妥懽帖睦尔</b>怠于政事，任由天下大乱。</p><p style=''margin-bottom: 16px;''><b>【挑河大役】</b><br>至正十一年，为了解决黄河水患，宰相<b>脱脱</b>下令强行征发十五万民夫和两万军队治理黄河。在酷暑与监工的严苛鞭笞下，底层民夫的生存到了极限。庞大的治河工程不仅未能拯救帝国，反而成了点燃火药桶的最后一根火柴。</p><p style=''margin-bottom: 16px;''><b>【石人一只眼】</b><br>白莲教首领<b>韩山童</b>与刘福通敏锐地捕捉到了爆发的临界点。他们暗中凿刻了一个独眼石人埋在黄河河道中，并四处散布童谣：“莫道石人一只眼，挑动黄河天下反。”当挑河民夫挖出石人时，神秘的预言瞬间转化为狂热的宗教造反力量。</p><p><b>【红巾燎原】</b><br>韩山童自称宋徽宗八世孙，誓要“驱除胡虏，恢复中华”。起义军头裹红巾，杀官造反。虽然韩山童很快被捕遇害，但刘福通率领红巾军席卷中原。随后，徐寿辉、郭子兴、朱元璋等群雄纷纷并起。元朝虽然派脱脱率军四处镇压，但脱脱遭权臣陷害被罢免赐死，元军主力随之瓦解。大元帝国被扫入历史的垃圾堆。</p>'
  characters:
  - 妥懽帖睦尔
  - 脱脱
  - 韩山童
  ai_notes: '【史实详述指引】：
    1. 若扮演妥懽帖睦尔（元顺帝）：展现末代君主的无能与迷茫。向用户说明元末朝廷频发的政变掏空了中枢权威，坦承你在关键时刻自毁长城，听信谗言罢免并赐死正在前线镇压红巾军的主帅脱脱，直接导致了大元军事体系的崩溃。
    2. 若扮演脱脱：以悲剧救火队长的身份复盘。向用户详细拆解你“变钞（印发新纸币）”和“挑河”这两大试图挽救帝国的激进政策，是如何因为底层官僚的贪腐而反噬帝国，成为逼反百姓的催命符的。
    3. 若扮演韩山童：以底层造反领袖的口吻作答。讲解白莲教和明教的神秘信仰体系是如何在绝望的灾民中形成组织力的。解释利用“石人”和“复宋”口号作为政治包装发动群众的底层操作细节。'
  dynamic_prompt: 【群聊基调：自然灾害与体制崩溃叠加的末世图卷】请根据《元史》等正史，深度解析元末黄河水患、通货膨胀（变钞）与高压劳役是如何三管齐下摧毁帝国的。还原红巾军起义初期的民间宗教组织形式。
秦朝·一统六国:
  manuscript: 第一卷 · 秦
  title: 六合归一：秦王扫平天下
  image: https://s3.bmp.ovh/2026/05/02/T7JAULil.png
  time: 秦王政十七年至二十六年（公元前230-221年）
  location: 咸阳 ➡️ 韩、赵、魏、楚、燕、齐
  story: >-
    <p style='margin-bottom: 16px;'><b>【东出之势】</b><br>战国末年，秦国经过商鞅变法、历代扩张，已经拥有最强的军队、最严密的法令和最充足的战争动员能力。秦王政亲政后，任用李斯、尉缭等人，把秦国长期积累的制度优势转化成连续灭国的战略节奏。对秦来说，这不再是夺几座城、割几块地，而是要把六国旧秩序彻底压碎，纳入一个统一帝国。</p>
    <p style='margin-bottom: 16px;'><b>【远交近攻】</b><br>秦的统一不是一场战役完成的，而是一套冷酷的次序。公元前230年，韩国最先灭亡，成为六国中第一个倒下的缺口；前228年，赵国都城邯郸被攻破，曾经能在长平抗秦的北方强国走向崩塌；前225年，秦将王贲引黄河、鸿沟之水灌大梁，魏国在水患与围困中灭亡。秦军像一把由西向东推进的铁犁，逐步碾碎山东六国的防线，也不断制造六国之间“谁也救不了谁”的孤立感。</p>
    <p style='margin-bottom: 16px;'><b>【楚地难平】</b><br>真正让秦国付出巨大代价的是楚国。楚地广阔，人口众多，战略纵深远比韩、魏更难处理。李信、蒙恬先率军伐楚而失利，说明秦军并非一路碾压，年轻将领的轻敌差点让统一进程翻车。秦王政重新请出老将王翦，给予六十万大军。王翦不急于决战，而是稳扎稳打，耗尽楚军锐气，最终攻灭楚国。这一战让秦王政明白：天下可以用强力统一，但强力也必须服从耐心和后勤。</p>
    <p style='margin-bottom: 16px;'><b>【最后孤城】</b><br>楚国之后，燕、代相继被平定，齐国则陷入极深的孤立。齐王建长期不救五国，等秦军真正压境时，已经没有任何诸侯能替齐国分担压力。前221年，齐王建被秦俘获，齐国灭亡。战国七雄最后一块拼图落下，数百年的诸侯并立局面结束。</p>
    <p><b>【天下一统】</b><br>秦王政第一次把广阔的华夏核心地区置于同一个中央政权之下。“六合归一”带来的不只是版图扩大，更是一个前所未有的问题：过去的天下靠诸侯、宗法、盟约和战争维持平衡，如今这些都被秦军打碎了。打下天下之后，究竟该怎样治理天下？秦朝接下来的每一步制度选择，几乎都从这个问题开始。</p>
  next_event: 秦朝·始皇称帝
  next_note: 六国被灭之后，秦王政面对的是一个前所未有的新问题：诸侯时代结束了，新的最高权力应该叫什么？下一案，就是“皇帝”这个称号的诞生。
  characters:
  - 秦始皇
  - 王翦
  - 李斯
  - 田建
  source_notes:
  - 主要依据《史记·秦始皇本纪》关于秦王政十七年至二十六年灭韩、赵、魏、楚、燕、齐的纪年记载。
  - 灭楚部分参考《史记·白起王翦列传》中李信、蒙恬伐楚失利以及王翦率六十万军伐楚的记载。
  - 齐国灭亡应表述为齐王建被秦所虏，不宜写成戏剧化的激烈攻城。
  ai_notes: '【史实详述指引】：若扮演秦始皇，请解释统一六国不是单纯的个人野心，而是战国长期兼并战争走到极限后的结果；若扮演王翦，请重点复盘灭楚为何不能轻敌；若扮演李斯，请说明统一之后制度重建的重要性；若扮演田建，请呈现齐国孤立与不战而降的处境。'
  dynamic_prompt: 【群聊基调：大一统开端】请围绕秦灭六国的战略、制度和战国末年格局回答，不要把统一简化成“秦始皇一个人很强”，要帮助用户理解秦国为何能完成这件事。

秦朝·始皇称帝:
  manuscript: 第一卷 · 秦
  title: 皇帝诞生：一个新称号的野心
  image: https://s3.bmp.ovh/2026/05/02/NW1Qac8J.png
  time: 秦始皇二十六年（公元前221年）
  location: 咸阳宫
  story: >-
    <p style='margin-bottom: 16px;'><b>【王号不够用了】</b><br>六国已灭，秦王政不再只是诸侯中的一王。过去的“王”号属于周天子体系下的列国君主，带着分封时代的旧影子，已经无法容纳这个新帝国的最高权力。群臣开始讨论：这位统一天下的人，应该拥有一个怎样的称号？称号看似是礼仪问题，实则是在给新的天下秩序命名。</p>
    <p style='margin-bottom: 16px;'><b>【三皇五帝】</b><br>廷议中，有人建议采上古“三皇”“五帝”的尊号。秦王政最终取“皇”“帝”二字合成“皇帝”，自称“始皇帝”。这不是简单改名，而是宣告：从此天下最高权力不再来自周天子的册封，也不再需要诸侯之间的承认，而集中于一个唯一的帝国君主。秦始皇把自己放在古代圣王与现实政治权力的交汇点上，试图让新称号拥有神圣性和压倒性的现实权威。</p>
    <p style='margin-bottom: 16px;'><b>【制度语言】</b><br>称号改变之后，政治语言也随之改变。皇帝自称“朕”，命令称“制”“诏”，印信称“玺”。这些词语后来成为中国帝制时代的基本语言，影响延续两千多年。它们不是装饰性的称谓，而是在每天的文书、命令、审判和任官中提醒天下：所有权力都从皇帝这个中心发出。</p>
    <p style='margin-bottom: 16px;'><b>【废谥与独尊】</b><br>秦始皇还废除了由后人评价君主善恶的谥法，因为他不能接受子议父、臣议君。对他来说，皇帝的尊严必须高于历史评价，也高于贵族传统的约束。这种设计让皇权获得了极高的神圣感，却也让最高权力更难被制度纠偏。</p>
    <p><b>【万世之梦】</b><br>秦始皇希望自己的王朝从“始皇帝”开始，二世、三世以至万世相传。但历史给他的回答极其残酷：秦朝不仅没有万世，连第二代都没有稳住。称号建立了帝国的顶点，却还没有解决帝国如何长久运行的问题。一个最高权力可以被命名，却不能只靠名字维持。</p>
  next_event: 秦朝·郡县天下
  next_note: 皇帝称号确立后，真正困难的问题来了：天下是重新分封给诸子功臣，还是直接由中央派官治理？这决定了秦朝的制度骨架。
  characters:
  - 秦始皇
  - 李斯
  - 王绾
  source_notes:
  - 主要依据《史记·秦始皇本纪》二十六年“皇帝”称号、废谥法、改命为制、令为诏、天子自称曰朕等记载。
  - “始皇帝、二世三世至于万世”是《史记·秦始皇本纪》的核心表述，回答时可引用其制度野心，但不要写成后世已经证明的必然失败论。
  ai_notes: '【史实详述指引】：若扮演秦始皇，请解释“皇帝”称号背后的政治意义；若扮演李斯，请说明称号和制度必须配套；若扮演王绾，可从传统诸侯秩序的角度提出分封顾虑。'
  dynamic_prompt: 【群聊基调：帝制开端】请帮助用户理解“皇帝”不是一个空洞称号，而是秦朝重塑天下秩序的第一步。

秦朝·郡县天下:
  manuscript: 第一卷 · 秦
  title: 废封立郡：帝国的骨架
  image: https://s3.bmp.ovh/2026/05/02/XRfVFBTi.png
  time: 秦始皇二十六年（公元前221年）
  location: 咸阳宫 ➡️ 天下三十六郡
  story: >-
    <p style='margin-bottom: 16px;'><b>【分封旧路】</b><br>天下初定，丞相王绾等人主张将诸子分封到燕、齐、楚等远地为王。他们的理由并不荒唐：疆域太大，道路遥远，如果没有宗室屏藩，一旦地方生变，中央可能鞭长莫及。在周代经验里，宗室诸侯既是地方统治者，也是王室的外层防线。</p>
    <p style='margin-bottom: 16px;'><b>【李斯反驳】</b><br>李斯坚决反对。他指出，周朝分封子弟功臣，后来诸侯彼此攻伐，天子无法控制天下。秦刚刚用巨大代价结束战国，如果再分封诸侯，就等于亲手把战国重新种回土地里。李斯真正害怕的不是某一个诸侯王，而是世袭地方权力一旦形成，就会在几代之后重新长成中央无法剪除的政治森林。</p>
    <p style='margin-bottom: 16px;'><b>【三十六郡】</b><br>秦始皇采纳李斯建议，废除分封，推行郡县制。天下被划为郡县，郡守、县令由中央任命，不能世袭。地方官员不再是割据的诸侯，而是皇帝权力向地方伸出的手臂。任命、考核、迁调、惩罚都掌握在中央手中，地方从“家族领地”变成了“国家行政区”。</p>
    <p style='margin-bottom: 16px;'><b>【权力下沉】</b><br>郡县制让秦朝可以把法律、户籍、赋税、徭役和兵役直接压到基层。过去普通百姓可能首先面对的是本国贵族和地方传统，现在他们面对的是统一帝国的官吏、文书和法令。这种穿透力极其强大，也极其冷硬。</p>
    <p><b>【秦制之重】</b><br>郡县制是中国历史上极重要的一根柱子。后世王朝可以批评秦暴政，却很难完全绕开秦的制度遗产。它证明大一统国家可以不依赖诸侯分封而运行，也暴露出中央集权的另一面：当最高决策失误时，庞大的行政机器会把压力迅速传导到每一个角落。</p>
  next_event: 秦朝·书同文车同轨
  next_note: 郡县制搭起了行政骨架，但帝国还需要统一文字、道路、货币和度量衡，让命令真正能在天下运行。
  characters:
  - 秦始皇
  - 李斯
  - 王绾
  source_notes:
  - 主要依据《史记·秦始皇本纪》二十六年王绾等请立诸子、李斯反对分封、秦始皇分天下为三十六郡的记载。
  - 回答时应把王绾的主张解释为传统封建秩序下的治理方案，不要简单丑化为保守无能。
  - 郡县制影响深远，但“后世都继承秦制”属于概括性分析，应与史实叙述区分开。
  ai_notes: '【史实详述指引】：重点解释分封制与郡县制的差别。不要简单嘲笑王绾保守，他代表的是传统大国治理经验；李斯代表的是秦式中央集权逻辑。'
  dynamic_prompt: 【群聊基调：制度选择】请围绕“为什么秦朝不再分封”回答，让用户理解郡县制是中国历史认知骨架中的关键柱子。

秦朝·书同文车同轨:
  manuscript: 第一卷 · 秦
  title: 同文同轨：把天下拧成一个帝国
  image: https://s3.bmp.ovh/2026/05/02/23zixxLe.png
  time: 秦始皇二十六年以后（公元前221年以后）
  location: 咸阳 ➡️ 全国郡县
  story: >-
    <p style='margin-bottom: 16px;'><b>【统一不止靠军队】</b><br>六国灭亡后，秦面对的并不是一张白纸。各地文字写法不同，货币形制不同，度量衡标准不同，道路车轨也不完全一致。军事统一只是第一步，真正困难的是让这片土地按照同一套规则运转。如果中央的命令到了旧楚、旧齐、旧赵就变成另一种写法、另一套尺度，帝国就仍然只是被军队暂时压住的拼图。</p>
    <p style='margin-bottom: 16px;'><b>【书同文】</b><br>秦统一文字书写规范，使政令、法律、文书能够跨越旧国边界流通。对普通人来说，这未必立刻温和，因为统一文字首先服务于国家治理和法律执行；对帝国来说，这意味着中央命令可以更准确地抵达地方，地方记录也能被中央读懂、审核和追责。</p>
    <p style='margin-bottom: 16px;'><b>【度量同衡】</b><br>秦统一度量衡和货币，把市场交易、赋税征收、工程调度放入同一套标准。半两钱、标准量器和统一尺度并不只是经济工具，它们让国家知道一户该缴多少、一仓该储多少、一段工程该征多少人力。标准化越彻底，帝国计算社会的能力就越强。</p>
    <p style='margin-bottom: 16px;'><b>【车同轨】</b><br>秦又修筑驰道，统一车轨，让军队、官吏、文书和物资能够更快移动。道路不是单纯方便出行，它是帝国的血管。咸阳的诏令、边郡的军报、工地的徭役调发，都依赖这套交通网络不断流动。</p>
    <p><b>【秩序的代价】</b><br>这些措施奠定了大一统帝国的日常秩序，也加重了秦朝对基层社会的改造强度。统一带来效率，也带来压力。对后世来说，“书同文、车同轨”常常显得宏大而正面；但对当时的民众来说，它也意味着旧习惯被强行重写，地方差异被迅速抹平，国家权力离个人生活更近了。</p>
  next_event: 秦朝·北击匈奴
  next_note: 当内部秩序被迅速统一后，秦始皇又把目光投向北方边境。匈奴压力、长城工程和徭役负担，开始成为帝国另一道沉重命题。
  characters:
  - 秦始皇
  - 李斯
  - 蒙恬
  source_notes:
  - 主要依据《史记·秦始皇本纪》“一法度衡石丈尺，车同轨，书同文字”的记载。
  - “小篆”等书体细节可作为后世文字学背景补充，但页面正文避免把非《史记》原句写成《史记》明文。
  - 统一货币、度量衡、车轨、文字可作为秦朝标准化工程理解，但具体执行细节不宜过度想象。
  ai_notes: '【史实详述指引】：回答时要把“书同文、车同轨”讲成治理工程，而不只是口号。可以解释文字、货币、度量衡、道路对统一国家的意义。'
  dynamic_prompt: 【群聊基调：统一工程】请从普通人能理解的角度解释标准化如何让一个新帝国真正运转起来，同时提示这种标准化背后的行政压力。

秦朝·北击匈奴:
  manuscript: 第一卷 · 秦
  title: 北境长城：帝国边界的代价
  image: https://s3.bmp.ovh/2026/05/02/b0OMZT2v.png
  time: 秦始皇三十二年至三十三年（公元前215-214年）
  location: 上郡、河南地、阴山一线
  story: >-
    <p style='margin-bottom: 16px;'><b>【北方压力】</b><br>秦统一六国后，北方草原的匈奴成为新的边境威胁。战国时代，各国可以各守一段边界；统一之后，北方问题变成了秦帝国必须独自承担的国家安全问题。对刚刚建立的大一统帝国来说，如果北部边地长期遭受侵扰，中央权威、边郡屯垦和交通线都会受到挑战。</p>
    <p style='margin-bottom: 16px;'><b>【蒙恬出塞】</b><br>秦始皇派大将蒙恬率军北击匈奴，收复河南地，将匈奴势力逐出黄河以南。蒙恬不是一次出兵后就撤回，而是长期镇守北方，经营边防。扶苏也被派往上郡监军，这让北境不只是军事前线，也成了秦朝皇位继承与政治风向极敏感的地方。</p>
    <p style='margin-bottom: 16px;'><b>【长城相连】</b><br>秦并不是凭空修出一整条长城，而是在秦、赵、燕旧长城基础上连接、增修，形成更连续的北方防线。同时，直道等交通工程也服务于边防调度。帝国开始用工程和军队固定自己的边界：哪里是内地，哪里是塞外，哪里需要驻军，哪里需要转运粮草，都被纳入国家规划。</p>
    <p style='margin-bottom: 16px;'><b>【边防机器】</b><br>长城真正可怕的地方，不只是城墙本身，而是它背后那套持续运转的边防机器。戍卒要轮换，粮草要北运，烽燧要传警，道路要维护，郡县要配合征发。秦朝的强大在这里表现得非常清楚：它能把一个刚统一不久的国家组织起来，投入到极其庞大的边疆工程中。</p>
    <p><b>【沉重徭役】</b><br>边防带来安全，也带来巨大劳役。修城、戍边、运粮、筑路，都需要从基层抽调人力。秦朝的制度机器越高效，动员百姓的能力就越强；而这种强动员，最终也会变成压在帝国根基上的重量。北击匈奴并不是“对”或“错”那么简单，它体现的是帝国安全与民力承受之间的紧张关系。</p>
  next_event: 秦朝·南征百越
  next_note: 北方边界被推稳之后，秦帝国也在向岭南推进。南征百越与灵渠工程，让秦朝的版图继续扩大，也让动员压力继续加深。
  characters:
  - 秦始皇
  - 蒙恬
  - 扶苏
  source_notes:
  - 主要依据《史记·秦始皇本纪》《史记·蒙恬列传》中蒙恬北击匈奴、略取河南地、筑长城以及扶苏监军上郡的记载。
  - “秦、赵、燕旧长城相连”可据《史记·蒙恬列传》理解，但具体线路、工程规模不宜写得过细。
  - 讨论徭役负担时，应作为制度后果分析，不要把所有秦亡原因都单线归结为修长城。
  ai_notes: '【史实详述指引】：若扮演蒙恬，请复盘北击匈奴、河南地和长城防线；若扮演扶苏，请联系上郡监军与后来沙丘之变；若扮演秦始皇，请解释边防与徭役之间的取舍。'
  dynamic_prompt: 【群聊基调：边疆与徭役】请帮助用户理解长城不是单纯景点，而是秦帝国边防体系、交通动员和基层负担的集中体现。

秦朝·南征百越:
  manuscript: 第一卷 · 秦
  title: 灵渠南下：帝国越过岭南
  image: https://s3.bmp.ovh/2026/05/02/ycv0UM2j.png
  time: 秦始皇三十三年（公元前214年）
  location: 岭南、灵渠、桂林郡、南海郡、象郡
  story: >-
    <p style='margin-bottom: 16px;'><b>【岭南难入】</b><br>秦统一中原后，继续向南方百越地区推进。岭南山川阻隔，气候湿热，道路崎岖，补给条件与中原完全不同。秦军在这里面对的不是六国都城式的攻坚，而是漫长、艰苦、陌生的边地战争。对北方和中原出身的士卒来说，岭南不只是远方，更像一个很难被既有经验解释的世界。</p>
    <p style='margin-bottom: 16px;'><b>【粮道之困】</b><br>南征最大的难题之一是补给。军队可以靠命令出发，却不能靠命令凭空吃饭。后世文献常把灵渠开凿与秦军南下联系在一起：这条沟通湘水、漓水的水道，让军粮、兵员和行政力量更容易进入岭南。若只据《史记》，则应谨慎表述为秦略取陆梁地、设置岭南诸郡；但从历史逻辑看，秦要稳定控制岭南，交通与补给一定是绕不开的核心问题。</p>
    <p style='margin-bottom: 16px;'><b>【设郡岭南】</b><br>秦最终在岭南设置桂林、南海、象等郡，把这片地区纳入帝国版图。郡县的牌子立起来，并不等于地方社会立刻被完全消化。任嚣、赵佗等秦将留驻南方，承担的任务既是军事镇守，也是把秦制推入一个原本与中原差异很大的区域。后来秦末天下大乱，赵佗割据岭南，建立南越国，说明秦的南方扩张留下了深远后续。</p>
    <p style='margin-bottom: 16px;'><b>【南方入口】</b><br>从更长的历史看，南征百越让岭南第一次被大一统帝国强力纳入政治视野。它不是简单的“征服故事”，而是南方开发、交通工程、移民戍守和地方整合的开端。秦朝没能长久统治这里，但后世王朝会不断回到这个方向，继续处理中央与岭南之间的距离。</p>
    <p><b>【扩张的重量】</b><br>北筑长城，南通岭南，秦朝一边建立前所未有的疆域，一边不断扩大徭役和军事动员。帝国版图越大，维持它的成本也越高。到秦始皇晚年，这套高压机器已经逼近极限：它能开山通渠，也能把无数普通人的命运卷进遥远而陌生的工程与战场。</p>
  next_event: 秦朝·焚书坑儒
  next_note: 版图和制度不断扩张的同时，秦始皇也试图统一思想与言论。帝国不只要管土地和人口，也开始管人们如何谈论过去。
  characters:
  - 秦始皇
  - 任嚣
  - 赵佗
  source_notes:
  - 主要依据《史记·秦始皇本纪》三十三年“略取陆梁地，为桂林、象郡、南海”的记载。
  - 岭南后续治理与赵佗割据，依据《史记·南越列传》。
  - 灵渠与具体开凿人物多见于《淮南子》《水经注》等材料，不应说成《史记》明文；页面只把它作为南征补给背景谨慎呈现。
  ai_notes: '【史实详述指引】：请解释灵渠的军事补给意义，以及岭南设郡对后世中国南方开发的影响。注意不要把百越简单写成被动背景，要承认岭南战争的复杂性。'
  dynamic_prompt: 【群聊基调：南方扩张】请围绕岭南、灵渠、补给和设郡回答，帮助用户理解秦朝疆域扩张背后的工程能力与社会成本。

秦朝·巨鹿之战:
  manuscript: 第一卷 · 秦
  title: 破釜沉舟：秦军主力的崩塌
  image: https://s3.bmp.ovh/2026/05/02/25Jdw1zU.png
  time: 秦二世三年（公元前207年）
  location: 巨鹿（今河北平乡一带）
  story: >-
    <p style='margin-bottom: 16px;'><b>【反秦风暴】</b><br>大泽乡起义后，反秦力量在关东迅速蔓延。秦将章邯一度连续击破陈胜、项梁等起义军，说明秦朝的军队、将领和后勤动员仍有强大反扑能力。赵王歇被秦军围困于巨鹿，城中危急，诸侯救兵却大多观望不前。许多人都在等待一个信号：秦军到底还能不能被击败？</p>
    <p style='margin-bottom: 16px;'><b>【项羽夺权】</b><br>楚军内部，主将宋义迟迟不进。项羽认为再拖下去赵国必亡，诸侯也会彻底丧胆，于是斩杀宋义，夺取兵权。这一步极其冒险：如果失败，他就是擅杀主帅的叛将；如果成功，他就能把楚军从犹豫中强行拽进决战。巨鹿之前，项羽已经没有退路。</p>
    <p style='margin-bottom: 16px;'><b>【破釜沉舟】</b><br>项羽率军渡河后，命士卒破釜沉舟，只带三日粮，切断退路。这不是单纯的血气之勇，而是一种残酷的心理动员：既然身后没有船、没有锅、没有长期营地，士兵就只能向前。楚军与秦军九战，大破王离所部，杀苏角、虏王离，秦军精锐遭到沉重打击。</p>
    <p style='margin-bottom: 16px;'><b>【诸侯俯首】</b><br>诸侯军原本躲在壁垒中不敢出战，直到看见秦军败势已成，才敢共同参战。史书写诸侯将领见项羽时“莫敢仰视”，这句话背后是战场威望的重新分配：反秦阵营从此不再只是各自求生的散兵，而有了一个能压服诸侯的军事中心。</p>
    <p><b>【主力折断】</b><br>巨鹿之战并不是秦朝灭亡的最后一幕，却是秦军主力信心和战场主动权崩塌的关键节点。此后章邯处境急转直下，后方赵高掣肘，前线士气动摇，最终率军降楚。秦朝失去关东战场的支柱，咸阳已经暴露在刘邦、项羽等人的进军路线之前。秦亡，已经从民变变成了军事崩盘。</p>
  next_event: 秦朝·子婴降刘
  next_note: 巨鹿之后，秦朝主力再难支撑天下。刘邦率军入关，赵高和秦二世的宫廷政治也走到尽头，最后一任秦王子婴即将登场。
  characters:
  - 项羽
  - 章邯
  - 王离
  - 赵歇
  source_notes:
  - 主要依据《史记·项羽本纪》关于项羽杀宋义、破釜沉舟、九战、大破王离、杀苏角、虏王离的记载。
  - 章邯围巨鹿、王离被虏及秦军形势，可参照《史记·秦始皇本纪》《史记·张耳陈余列传》。
  - 不写具体夸张兵力数字，避免把后世通俗说法当作确定史实。
