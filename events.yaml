三国·白门楼斩吕布:
  manuscript: M A N U S C R I P T · 3 K I N G D O M S
  title: 陨落的飞将：白门楼之变
  image: https://s3.bmp.ovh/2026/05/02/FUuDq4Lk.png
  time: 建安三年（公元198年）
  location: 徐州下邳·白门楼
  story: '<p style=''margin-bottom: 16px;''><b>【水淹下邳】</b><br>建安三年冬，<b>曹操</b>大军围攻徐州下邳。天下无双的飞将<b>吕布</b>，曾诛董卓、破黑山、败刘备，此刻却被困孤城。曹操决沂、泗之水灌城，下邳城内水患成灾，军心涣散。吕布却终日与妻妾饮酒作乐，甚至因爱马被盗而严惩部将，致使众叛亲离。</p><p style=''margin-bottom: 16px;''><b>【众叛亲离】</b><br>部将侯成、宋宪、魏续等人忍无可忍，绑了谋士陈宫向曹军投降。吕布见大势已去，在白门楼上无奈命令左右将自己绑了，开城投降。一代飞将，就这样沦为阶下囚。</p><p style=''margin-bottom: 16px;''><b>【致命的一击】</b><br>白门楼上，吕布被押解到曹操面前。为了活命，他卑微地乞求：<b>“明公将步骑，布将全骑，天下不足定也！”</b> 曹操爱才，心中确有犹豫，转头问客居在此的<b>刘备</b>。刘备冷冷地吐出一句致命的回答：<b>“明公不见丁建阳、董卓之事乎？”</b>（你忘了被他背叛杀死的干爹丁原和董卓了吗？）</p><p><b>【将星陨落】</b><br>吕布听罢，指着刘备大骂其是“大耳儿最叵信者”。然而大局已定，曹操下令将吕布缢死，随后枭首示众。而傲骨铮铮的谋士陈宫，拒绝了曹操的挽留，慷慨赴死。一代乱世虓虎，就这样在屈辱与背叛中，悲惨地落幕。</p>'
  characters:
  - 吕布
  - 曹操
  - 刘备
  - 陈宫
  ai_notes: '【史实详述指引】：

    1. 若扮演吕布：摒弃''三姓家奴''的狂躁。向用户理性复盘下邳之战的军事细节：沂水、泗水灌城对城防和后勤造成的毁灭性打击；以及你对待部下严苛导致侯成等人背叛的内因。承认自己在政治上的短视，坦然接受败局。

    2. 若扮演曹操：向用户解释你不杀刘备却杀吕布的真实用人逻辑。分析吕布强大的骑兵统帅能力带来的诱惑，与他过往违背政治契约（杀丁原董卓）带来的巨大风险之间的博弈。

    3. 若扮演刘备：坦承你那句''不见丁建阳董卓之事''是借刀杀人。向用户分析你当时的处境：如果吕布投降曹操，曹操实力大增，你将永无出头之日。这是纯粹的战略考量。

    4. 若扮演陈宫：冷静复盘你与吕布的合作。解释你为什么背叛曹操（兖州名士被杀引发的士族反抗），以及你为什么最终求死（政治理想彻底破灭，不愿再次妥协）。'
