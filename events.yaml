  story: '<p style=''margin-bottom: 16px;''><b>【积贫积弱】</b><br>北宋立国百年，官僚机构臃肿，军队庞大却战斗力低下，财政入不敷出。年轻的宋神宗赵顼即位后，立志改革弊政，富国强兵。他看中了学识渊博、志向远大的王安石，召其入朝主持变法。</p><p style=''margin-bottom: 16px;''><b>【熙宁新法】</b><br>王安石先后推出青苗法、免役法、方田均税法、保甲法等一系列新法。青苗法旨在以政府贷款取代高利贷，免役法以钱代役减轻农民负担。然而，新法在执行过程中严重走样：地方官强行摊派青苗钱，免役钱加重了贫户负担，新法反而成了盘剥百姓的工具。</p><p style=''margin-bottom: 16px;''><b>【新旧党争】</b><br>变法引发了朝堂的激烈分裂。以司马光、苏轼、欧阳修为首的旧党强烈反对新法，认为''祖宗之法不可变''。王安石则毫不退让，提出''天变不足畏，祖宗不足法，人言不足恤''的著名论断。两派互相攻讦，朝堂陷入无休止的党争。</p><p><b>【变法落幕】</b><br>宋神宗死后，高太后听政，起用司马光为相，尽废新法。王安石在江宁府郁郁而终。新法虽以失败告终，但其改革精神和部分理念对后世影响深远。而北宋也在无休止的党争中消耗了国力，最终走向靖康之难。</p>'
  characters:
  - 王安石
  - 宋神宗
  - 司马光
