五代·后周世宗北伐:
  manuscript: M A N U S C R I P T · F I V E
  title: 出师未捷：五代第一明君的遗憾
  time: 显德六年（公元959年）
  location: 开封 ➡️ 幽州
  story: '<p style=''margin-bottom: 16px;''><b>【五代英主】</b><br>后周世宗<b>柴荣</b>是五代时期最杰出的君主。他即位后励精图治，整顿军纪，均定田赋，招抚流亡，使后周国力大增。他曾立下宏愿：''以十年开拓天下，十年养百姓，十年致太平。'' 然而天不假年，这位英主的抱负最终未能实现。</p><p style=''margin-bottom: 16px;''><b>【南征北战】</b><br>柴荣先后发动了对后蜀、南唐的战争，收复了秦、凤、阶、成四州和淮南十四州，大大扩展了后周的疆域。随后，他将目光转向北方，决心收复被契丹占据的燕云失地。显德六年，柴荣亲率大军北伐，势如破竹。</p><p style=''margin-bottom: 16px;''><b>【势如破竹】</b><br>北伐大军连克瀛州、莫州、易州，契丹守军望风而降。仅四十二天，后周军便收复三关三州十七县。幽州（今北京）近在咫尺，契丹震动。柴荣准备乘胜进攻幽州，一举收复燕云十六州。</p><p><b>【天不假年】</b><br>就在这关键时刻，柴荣突然病倒，被迫班师回朝。不久后，这位年仅三十九岁的英主病逝于开封。他死后仅半年，赵匡胤发动陈桥兵变，建立宋朝。柴荣的北伐大业功亏一篑，燕云十六州直到四百年后才被明朝收复。后世史家无不为之扼腕叹息。</p>'
  characters:
  - 柴荣
  - 赵匡胤
  - 耶律璟
  ai_notes: '【史实最高红线】：

