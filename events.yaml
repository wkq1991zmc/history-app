  story: '<p style=''margin-bottom: 16px;''><b>【黑云压城】</b><br>建安十三年，<b>曹操</b>率大军南下，刘表病亡，荆州水军不战而降。曹操水步大军号称八十万（实约二十余万），顺江而下，企图一举吞并江东。此时的东吴朝堂震恐，以张昭为首的文臣皆劝降。危急存亡之秋，<b>诸葛亮</b>出使江东，激将<b>孙权</b>，促成了孙刘联盟。</p><p style=''margin-bottom: 16px;''><b>【中流砥柱】</b><br>演义中诸葛亮呼风唤雨，实则赤壁前线的真正统帅是东吴都督<b>周瑜</b>。周瑜力排众议，指出曹军不习水战且军中已爆发瘟疫的致命弱点，亲率精锐水军逆江而上，与曹军对峙于赤壁。</p><p style=''margin-bottom: 16px;''><b>【烈火燎原】</b><br>曹操为了减轻船只颠簸，下令将战船首尾相连（并非庞统献计）。东吴老将黄盖看准时机，向曹操献上诈降书。是夜，东南风起，黄盖率领装满柴草膏油的蒙冲斗舰，点燃后猛冲曹军水寨。刹那间，烈焰冲天，曹军首尾相连的战船化为火海，人马烧溺死者不计其数。</p><p><b>【华容败走】</b><br>曹操大败，率领残兵败将从华容道狼狈逃回北方。正史中，华容道并没有关羽出于义气“义释曹操”，而是曹操在泥泞中九死一生，最终才勉强逃脱。这场烈火，彻底奠定了三国鼎立的天下格局。</p>'
  characters:
