五代·儿皇帝石敬瑭:
  manuscript: M A N U S C R I P T · F I V E
  title: 燕云十六州：屈辱的割让
  time: 天显十一年（公元936年）
  location: 太原 ➡️ 洛阳
  story: '<p style=''margin-bottom: 16px;''><b>【君臣猜忌】</b><br>后唐清泰三年，河东节度使<b>石敬瑭</b>镇守太原，手握重兵。后唐末帝李从珂对他极度猜忌，屡次试图削夺其兵权。石敬瑭深知自己处境危险，暗中积蓄力量，准备反叛。但他兵力不足，难以与朝廷抗衡，于是将目光投向了北方的契丹。</p><p style=''margin-bottom: 16px;''><b>【割地求援】</b><br>石敬瑭派使者向契丹主耶律德光求援，开出了令人震惊的条件：割让<b>燕云十六州</b>给契丹，并尊耶律德光为''父皇帝''，自称''儿皇帝''。燕云十六州是中原王朝北方的天然屏障，失去此地，中原门户大开，无险可守。</p><p style=''margin-bottom: 16px;''><b>【契丹南下】</b><br>耶律德光大喜，亲率五万骑兵南下支援石敬瑭。在契丹铁骑的帮助下，石敬瑭大败后唐军队，攻入洛阳，建立后晋。石敬瑭如约割让燕云十六州，每年向契丹进贡帛三十万匹。中原王朝从此失去了抵御北方游牧民族的战略屏障。</p><p><b>【遗祸百年】</b><br>石敬瑭的割地行为遗祸深远。燕云十六州的丢失，使得后来的北宋始终面临北方威胁，不得不维持庞大军队，财政负担沉重。直到明朝洪武年间，徐达北伐才收复此地。石敬瑭也因此成为中国历史上最著名的卖国贼之一，遗臭万年。</p>'
  characters:
