秦朝·子婴降刘:
  manuscript: 第一卷 · 秦
  title: 素车白马：大秦落幕
  image: https://s3.bmp.ovh/2026/05/02/4kG7vN4T.png
  time: 秦王子婴元年（公元前207年）
  location: 咸阳、轵道、关中
  story: >-
    <p style='margin-bottom: 16px;'><b>【赵高弑君】</b><br>巨鹿之后，秦朝败局已难挽回。前线失利，关东尽反，咸阳宫内却仍在上演权力自保的戏码。赵高为了转嫁罪责、保住性命，逼迫秦二世胡亥自杀，又改立子婴。此时的子婴已经不再称皇帝，而称秦王，这本身就说明秦朝的天下秩序已经坍缩，只剩关中一隅苦苦支撑。</p>
    <p style='margin-bottom: 16px;'><b>【诛杀赵高】</b><br>子婴并非完全无能。他看清赵高祸国乱政，设计诛杀赵高，试图替秦朝止血。但这一步来得太晚：扶苏、蒙恬已死，李斯已亡，秦军主力溃散，关东诸侯和起义军已经逼近关中。一个末代君主即使有清醒判断，也很难在废墟上重新撑起朝廷、军队与地方秩序。</p>
    <p style='margin-bottom: 16px;'><b>【刘邦入关】</b><br>刘邦率军先入武关，逼近咸阳。相比项羽的锋芒毕露，刘邦此时更懂得收拢人心。他一路约束军队，争取关中百姓与秦朝旧吏的接受。面对大势已去的局面，子婴没有选择把关中拖入最后的血战，而是乘素车白马，系颈以组，在轵道旁向刘邦投降。秦朝自公元前221年统一天下，到此不过十五年。</p>
    <p style='margin-bottom: 16px;'><b>【约法三章】</b><br>刘邦进入咸阳后，没有立刻把秦的宫室府库洗劫一空，而是宣布约法三章，暂时安定关中。这一步非常关键：秦人刚刚经历严刑峻法和连年动员，最害怕的是新的军队继续带来屠掠。刘邦用相对克制的姿态，为自己后来争夺天下积累了政治资本。</p>
    <p><b>【帝国余烬】</b><br>不久项羽入关，杀子婴，焚秦宫室。秦朝灭亡，但秦留下的郡县、皇帝、法令、统一标准并没有一同消失。这个短命王朝倒下了，它搭出的帝国骨架却被后世反复继承。秦的失败在于过度压迫和政治失控，秦的遗产则在于它第一次证明：天下可以被组织成一个高度集中的统一国家。</p>
  characters:
  - 子婴
  - 刘邦
  - 赵高
  - 项羽
