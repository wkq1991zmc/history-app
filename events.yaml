  story: '<p style=''margin-bottom: 16px;''><b>【平城之困】</b><br>北魏统一北方后，定都平城。这里气候苦寒，粮食转运困难，且保守的鲜卑旧贵族势力盘根错节。在杰出的政治家<b>冯太后</b>抚育下长大的孝文帝<b>元宏</b>深知，仅靠游牧民族的马上武力，无法长久统治广袤的中原汉地，唯有彻底融入汉文化体系，才能确立正统。</p><p style=''margin-bottom: 16px;''><b>【假途伐虢】</b><br>迁都洛阳阻力极大。太和十七年，元宏以“南伐南齐”为名，强行征发三十万大军南下。秋雨连绵，道路泥泞，随行的鲜卑贵族疲惫不堪，群臣叩马苦谏停止南伐。元宏乘机摊牌：“如果不南伐，就必须迁都洛阳。”两害相权，群臣只能被迫同意迁都。</p><p style=''margin-bottom: 16px;''><b>【断发易服】</b><br>迁都洛阳后，元宏推行了古代历史上最激进的汉化改革：禁穿鲜卑服，改穿汉服；朝廷上断绝鲜卑语，三十岁以下官员必须说汉语；将拓跋氏改为元氏；甚至由皇帝主婚，强令鲜卑贵族与汉族四大门阀（崔、卢、郑、王）联姻，从血缘上进行深度绑定。</p><p><b>【帝国裂痕】</b><br>宗室大将<b>元勰</b>等全力支持改革，但激进的汉化也引发了强烈的反噬。留守北方的六镇军人（未被汉化的鲜卑贵族与底层士卒）感到被洛阳的朝廷彻底抛弃，阶级矛盾与民族矛盾种下了六镇大起义的火种。北魏虽然最终分裂，但孝文帝的改革却为后来隋唐大一统的民族融合奠定了坚实的基础。</p>'
