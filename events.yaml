  location: 临安（杭州）·大理寺狱中
  story: '<p style=''margin-bottom: 16px;''><b>【北伐之恨】</b><br>绍兴十年，<b>岳飞</b>率领的岳家军在郾城、颍昌大败金兀术的拐子马与铁浮图，兵锋直指朱仙镇，距离收复故都汴京仅一步之遥。然而，就在这克复中原的历史转折点，南宋朝廷却连下十二道金牌，严令岳飞班师回朝。十年之功，毁于一旦，岳飞愤惋泣下：“所得州郡，一朝全休！”</p><p style=''margin-bottom: 16px;''><b>【帝王的猜忌】</b><br>撤军的背后，是南宋开国皇帝<b>赵构</b>深深的恐惧。宋朝立国之本就是“崇文抑武、防范武将专权”。随着岳家军的不断壮大，赵构深怕岳飞成为第二个赵匡胤（黄袍加身）。同时，金国在议和谈判中提出核心条件：“必杀岳飞，而后和可成”。为了保住自己江南的半壁江山和皇权，赵构动了杀心。</p><p style=''margin-bottom: 16px;''><b>【莫须有之罪】</b><br>宰相<b>秦桧</b>心领神会，充当了皇帝的白手套。他收买岳飞部将诬告岳飞谋反，将其下狱。面对严刑拷打，岳飞宁死不屈，在供状上写下绝笔：“天日昭昭，天日昭昭！” 韩世忠曾当面质问秦桧岳飞究竟犯了何罪，秦桧心虚地给出了那句遗臭万年的回答：“其事体莫须有（也许有吧）。”</p><p><b>【风波亭饮恨】</b><br>绍兴十一年岁末除夕夜，在赵构的默许下，一代抗金名将岳飞被以“莫须有”的罪名赐死于大理寺狱中，年仅三十九岁。其长子岳云、部将张宪一并被斩首。南宋也彻底失去了收复中原的最后希望。</p>'
