汉朝·楚汉之争:
  manuscript: 第二卷 · 汉
  title: 楚汉相争：谁能接住秦的遗产
  image: https://s3.bmp.ovh/2026/05/02/4kG7vN4T.png
  time: 汉元年至汉五年（公元前206-202年）
  location: 关中、彭城、荥阳、垓下
  story: >-
    <p style='margin-bottom: 16px;'><b>【秦亡之后】</b><br>秦朝灭亡后，天下并没有立刻进入稳定的新秩序。项羽入关后分封十八路诸侯，自号西楚霸王，却把关中分给秦降将章邯等人，又将先入关中的刘邦迁往汉中。表面上看，这是恢复诸侯秩序；实际上，秦制留下的郡县、关中粮仓和帝国交通仍然摆在那里，谁能接住这套遗产，谁才可能真正号令天下。</p>
    <p style='margin-bottom: 16px;'><b>【汉中出兵】</b><br>刘邦被迫入汉中，看似远离中原，实则保住了重新起家的空间。萧何替他守住后方、收拾人心，张良帮助他判断天下形势，韩信则被拜为大将，成为后来反攻的关键。随后汉军明修栈道、暗度陈仓，重新夺取关中。关中是秦的根本之地，粮草、人口、山河形势都足以支撑一场长期争霸，刘邦从这里获得了与项羽抗衡的根据地。</p>
    <p style='margin-bottom: 16px;'><b>【成皋拉锯】</b><br>项羽勇猛无敌，在彭城大破刘邦，汉军几乎溃散。可刘邦最可怕的地方，恰恰是能在惨败后继续组织下一轮抵抗。荥阳、成皋一线成为楚汉长期拉锯的主战场：前线项羽屡屡取胜，却需要亲自奔走各处灭火；后方韩信北伐齐赵、彭越扰楚粮道、英布倒戈，逐渐把西楚的战略纵深掏空。项羽赢了许多仗，却输掉了整个局面。</p>
    <p style='margin-bottom: 16px;'><b>【人心与制度】</b><br>楚汉之争不是单纯的武力决斗。项羽重个人威望和诸侯分封，善于冲锋，却不善于建立稳定的政治秩序；刘邦出身不高，却能容纳萧何、张良、韩信等不同类型的人才，也更愿意利用秦留下的郡县框架。一个像旧时代的霸王，一个更接近新帝国的继承者。</p>
    <p><b>【垓下结局】</b><br>公元前202年，汉军在垓下合围项羽。四面楚歌之中，项羽突围至乌江，自刎而死。楚汉之争的胜负，不只是刘邦和项羽个人性格的胜负，更是两种建国路线的胜负：项羽试图恢复诸侯分封，刘邦最终接住了秦留下的大一统遗产。汉朝，就是在这场废墟上的再选择中诞生的。</p>
  next_event: 汉朝·刘邦称帝
  next_note: 项羽败亡后，刘邦真正面对的问题不再是打天下，而是怎样把天下重新安放进一个可运行的国家结构里。
  characters:
  - 刘邦
  - 项羽
  - 韩信
  - 张良
  source_notes:
  - 主要依据《史记·项羽本纪》《史记·高祖本纪》《史记·淮阴侯列传》。
  - 楚汉之争应理解为秦亡后政治秩序重组，不宜只讲成刘邦、项羽的个人恩怨。
  ai_notes: '【史实详述指引】：请把楚汉之争讲成秦亡后“帝国继承权”的争夺。回答时区分项羽分封秩序与刘邦关中根据地的制度意义，说明韩信北伐、彭越游击、英布倒戈如何共同拖垮项羽。'
  dynamic_prompt: 【群聊基调：秦亡后新秩序的选择】请围绕楚汉双方的战略、后勤和政治路线回答，帮助用户理解汉朝不是从空地上建立的，而是在秦制废墟上重新接管天下。

汉朝·刘邦称帝:
  manuscript: 第二卷 · 汉
  title: 汉承秦制：新王朝的第一张图纸
  image: https://s3.bmp.ovh/2026/05/02/T7JAULil.png
  time: 汉五年（公元前202年）
  location: 定陶、长安、关中
  story: >-
    <p style='margin-bottom: 16px;'><b>【登基定天下】</b><br>垓下之战后，诸侯推戴刘邦为皇帝。刘邦即皇帝位，国号汉，史称汉高祖。这个新王朝名义上推翻了秦，实际却不能抛开秦的制度遗产：皇帝、郡县、律令、官僚体系仍是治理大一统天下的基本工具。刘邦真正面对的问题不是“要不要像秦”，而是“如何继承秦制而不重蹈秦亡”。</p>
    <p style='margin-bottom: 16px;'><b>【郡国并行】</b><br>刘邦吸取秦朝不分封导致六国旧地不稳的教训，也害怕完全恢复战国式割据，于是采取郡县与封国并行的办法。一方面中央直接管理许多郡县，另一方面又分封同姓王和少数异姓功臣王，希望用亲族和功臣拱卫天下。这是一种过渡性安排：既承认秦的中央集权有效，又承认天下刚定，人心和地方秩序还不能被中央一口吞下。</p>
    <p style='margin-bottom: 16px;'><b>【功臣与皇权】</b><br>打天下靠功臣，坐天下却要防功臣。韩信、彭越、英布等异姓王拥有独立兵权和地方根基，对新生皇权既是支柱，也是威胁。刘邦晚年陆续剪除异姓王，并不只是个人猜忌，也有制度安全的考虑：一旦封国带兵自立，楚汉之争可能换一种形式重来。但这种清洗也给汉初政治留下了沉重阴影。</p>
    <p style='margin-bottom: 16px;'><b>【约法与休养】</b><br>刘邦入关时曾约法三章，称帝后也必须面对秦末以来百姓疲敝、田园荒芜、户口流散的现实。汉初统治不能再像秦末那样高压催逼，只能先让社会喘气。于是减轻徭役、恢复农业、安抚功臣与诸侯，成为新王朝站稳脚跟的基本路线。</p>
    <p><b>【汉初底色】</b><br>汉朝的开端并不辉煌，而是疲惫、谨慎、充满妥协。它一边继承秦的大一统框架，一边降低治理强度、恢复民生。理解汉朝，第一步就是看到这层复杂底色：它不是秦的简单反面，而是秦制的修补版。汉朝之所以能长久，恰恰在于它没有把“反秦”理解成抛弃一切秦制。</p>
  next_event: 汉朝·白登之围
  next_note: 内部秩序刚刚重建，北方草原压力又逼到眼前。白登之围让汉朝意识到，帝国不是想强就能立刻强起来。
  characters:
  - 刘邦
  - 萧何
  - 张良
  - 韩信
  source_notes:
  - 主要依据《史记·高祖本纪》《汉书·高帝纪》。
  - “汉承秦制”是后世制度史概括，不应说成刘邦当时明确提出的原话。
  ai_notes: '【史实详述指引】：回答时重点解释汉初为什么不能完全废秦制，也不能完全恢复分封。请说明郡国并行、功臣封王和同姓王分封都是新王朝稳定天下的权宜安排。'
  dynamic_prompt: 【群聊基调：开国后的制度修补】请帮助用户理解汉朝开国不是浪漫胜利，而是对秦制、分封、功臣集团和民生恢复之间的艰难平衡。

汉朝·白登之围:
  manuscript: 第二卷 · 汉
  title: 白登之围：新帝国的冷水
  image: https://s3.bmp.ovh/2026/05/02/b0OMZT2v.png
  time: 汉高祖七年（公元前200年）
  location: 平城白登山（今山西大同一带）
  story: >-
    <p style='margin-bottom: 16px;'><b>【北方新敌】</b><br>汉初，匈奴在冒顿单于统合下迅速强大。秦末战乱削弱了中原，草原却出现了更有组织的骑兵政权。刘邦刚刚平定中原，便遇到北方边境的巨大压力。韩王信投降匈奴后，刘邦亲率大军北上，想以开国余威解决边患，也想证明新汉并不比秦弱。</p>
    <p style='margin-bottom: 16px;'><b>【轻敌深入】</b><br>汉军前锋推进到平城附近，刘邦因急于追击而与主力脱节。冒顿单于以精骑诱敌，随后用数十万骑兵把刘邦围困在白登山。汉军在城塞、粮草和步兵作战上有经验，却难以适应草原骑兵的高速包围。开国皇帝被围七日，寒风、缺粮和敌骑环伺，让汉朝第一次清楚看见自己与匈奴之间的差距。</p>
    <p style='margin-bottom: 16px;'><b>【陈平解围】</b><br>危急之中，陈平献计，通过匈奴阏氏从中斡旋，汉军才得以脱身。史书没有把这一幕写成英雄凯旋，而更像一场惊险脱困。白登之围不是辉煌胜利，而是一记冷水：刚建立的汉朝国力尚弱，骑兵不足，边防体系也未成熟，不能用秦始皇式的强硬动员立刻压服草原。</p>
    <p style='margin-bottom: 16px;'><b>【现实低头】</b><br>刘邦回到中原后，汉朝必须重新评估边疆政策。对匈奴硬打，财政、马政和兵力都跟不上；完全放任，又会让北边郡县长期不安。于是朝廷开始在屈辱和现实之间寻找平衡。</p>
    <p><b>【和亲时代】</b><br>此后汉朝对匈奴长期采取和亲、岁贡和边境防御的策略。这并非简单软弱，而是汉初国力、骑兵能力和财政承受力共同决定的现实选择。直到文景积累国力，马政和财政逐渐恢复，汉武帝时代才真正转入反攻。白登之围，是汉朝从开国热血走向现实政治的一课。</p>
  next_event: 汉朝·吕后临朝
  next_note: 外部压力迫使汉初选择休养生息，而内部权力也进入危险阶段。刘邦去世后，吕后将成为帝国实际掌舵者。
  characters:
  - 刘邦
  - 冒顿单于
  - 陈平
  source_notes:
  - 主要依据《史记·匈奴列传》《史记·高祖本纪》。
  - 白登之围的具体兵力数字在史书中有夸张成分，回答时宜说明“号称”与实际规模可能不同。
  ai_notes: '【史实详述指引】：请解释白登之围为何改变汉初对匈奴策略。不要简单骂“和亲软弱”，要说明财政、马政、骑兵训练、边防地理和民生恢复对国家决策的约束。'
  dynamic_prompt: 【群聊基调：汉初国力与草原压力】请从军事现实和国家承受力角度回答，帮助用户理解汉初为什么先忍耐、积累，而不是马上发动全面反攻。

汉朝·吕后临朝:
  manuscript: 第二卷 · 汉
  title: 吕后临朝：开国之后的权力硬仗
  image: https://s3.bmp.ovh/2026/05/02/O2VZcip9.png
  time: 汉惠帝元年至吕后八年（公元前194-180年）
  location: 长安、长乐宫
  story: >-
    <p style='margin-bottom: 16px;'><b>【皇权过渡】</b><br>刘邦去世后，惠帝刘盈即位，吕后成为实际掌权者。汉朝刚刚建立，皇帝年少，功臣、刘氏诸王、吕氏外戚和宫廷势力交错在一起，任何权力过渡都可能引发内战。吕后的处境并不只是“后宫干政”四个字，她面对的是一个尚未定型的新王朝。</p>
    <p style='margin-bottom: 16px;'><b>【铁腕政治】</b><br>吕后手段残酷，对戚夫人和赵王刘如意的报复尤其骇人。她也重用吕氏族人，分封诸吕，试图让外戚成为权力支柱。这些做法让刘氏宗室和开国功臣深感不安：刘邦刚刚剪除异姓王，吕氏外戚却又像新的政治集团一样长出来。</p>
    <p style='margin-bottom: 16px;'><b>【并非只有残暴】</b><br>但吕后执政时期，汉朝总体延续休养生息，不轻易发动大规模战争，社会经济继续恢复。她在政治上强硬，在国家路线却并未重新开启秦式高压扩张。她的历史形象不能只用宫廷酷刑概括，也要放在汉初稳定政权的困局里理解：她既是残酷的胜利者，也是维持汉初秩序的实际执政者。</p>
    <p style='margin-bottom: 16px;'><b>【功臣观望】</b><br>吕后在世时，周勃、陈平等开国功臣并没有轻易发难。他们知道吕后掌握宫廷和外戚力量，也知道贸然动手可能让汉朝陷入内战。汉初政治的可怕之处，就在于所有人都在等一个时机：谁先动，谁可能成为乱臣；谁动晚，谁可能被清除。</p>
    <p><b>【诸吕之乱】</b><br>吕后死后，周勃、陈平等开国功臣联合刘氏宗室诛灭诸吕，迎立代王刘恒，是为汉文帝。这场政变说明：汉初权力结构尚未稳定，外戚、宗室、功臣之间的边界仍要用鲜血重新划定。它也预示了汉代政治的长期主题：皇帝、外戚、功臣和宗室之间，永远需要重新平衡。</p>
  next_event: 汉朝·文景之治
  next_note: 诸吕被平定后，汉文帝即位。汉朝终于进入一段真正低强度、重恢复的治理时期。
  characters:
  - 吕后
  - 刘盈
  - 陈平
  - 周勃
  source_notes:
  - 主要依据《史记·吕太后本纪》《史记·陈丞相世家》《汉书·高后纪》。
  - 评价吕后应区分宫廷斗争中的残酷手段与国家治理上的休养生息。
  ai_notes: '【史实详述指引】：请避免把吕后单纯脸谱化为毒后。回答时既要讲戚夫人、诸吕分封等残酷权力斗争，也要讲汉初休养生息政策的延续。'
  dynamic_prompt: 【群聊基调：汉初权力过渡】请围绕外戚、功臣和刘氏宗室的关系回答，帮助用户理解新王朝在第一代君主死后为何极易发生权力震荡。

汉朝·文景之治:
  manuscript: 第二卷 · 汉
  title: 文景之治：帝国开始养伤
  image: https://s3.bmp.ovh/2026/05/02/NW1Qac8J.png
  time: 汉文帝至汉景帝时期（公元前180-141年）
  location: 长安、关中、天下郡国
  story: >-
    <p style='margin-bottom: 16px;'><b>【轻徭薄赋】</b><br>汉文帝、汉景帝时期，朝廷尽量减少徭役和赋税，让经历秦末战争和楚汉之争的社会恢复元气。文帝以节俭著称，宫室、陵墓、车服都力求简约，与秦始皇式的大工程形成鲜明对照。对刚从乱世中走出的百姓来说，最重要的不是宏大口号，而是少征一点、少役一点、能安稳种地。</p>
    <p style='margin-bottom: 16px;'><b>【黄老政治】</b><br>汉初治理常被称为黄老之治，核心不是完全不管，而是降低国家对社会的压迫强度。秦朝留下的郡县、律令和官僚系统仍在，但运行速度放慢了，刑罚减轻了，朝廷不再时时把民力推到极限。文景时期的“无为”，不是没有国家，而是让国家少折腾。</p>
    <p style='margin-bottom: 16px;'><b>【刑罚与民生】</b><br>文帝废除肉刑、减轻刑罚，虽然后续执行仍有复杂之处，但方向上代表汉初对秦法严酷的一次调整。朝廷也鼓励农业生产，减少不必要的耗费。战乱中流散的人口重新回到土地，地方秩序慢慢恢复，汉朝的统治基础也因此变厚。</p>
    <p style='margin-bottom: 16px;'><b>【国库充实】</b><br>经过几十年恢复，粮仓逐渐充盈，钱币串绳腐朽，太仓积粟陈陈相因。文景之治为汉武帝后来的大规模对外战争和制度改革积累了物质基础。没有文景的积累，就没有武帝时代北击匈奴、经营西域的底气。</p>
    <p><b>【隐伏问题】</b><br>但文景之治并不是没有裂缝。诸侯王国势力仍然庞大，地方豪强逐渐坐大，匈奴压力也没有根除。汉朝表面安静，深层矛盾正在等待下一次爆发。所谓盛世，往往不是矛盾消失，而是国家暂时有能力把矛盾压在水面之下。</p>
  next_event: 汉朝·七国之乱
  next_note: 休养生息让国家恢复了，但诸侯王国也在变强。中央与地方封国的矛盾，很快会在七国之乱中爆发。
  characters:
  - 汉文帝
  - 汉景帝
  - 贾谊
  - 晁错
  source_notes:
  - 主要依据《史记·孝文本纪》《史记·孝景本纪》《汉书·食货志》。
  - “黄老之治”是对汉初治理风格的概括，回答时不宜说成朝廷完全无为。
  ai_notes: '【史实详述指引】：请解释文景之治为什么是汉朝强盛的蓄水期。回答时要把减税、减刑、节俭、人口恢复和国库积累联系起来，同时指出诸侯王问题仍然存在。'
  dynamic_prompt: 【群聊基调：休养生息与帝国蓄力】请从秦末创伤恢复、农业社会承载力和国家财政角度回答，让用户理解汉朝强盛不是突然出现的。

汉朝·七国之乱:
  manuscript: 第二卷 · 汉
  title: 七国之乱：削藩的第一次大考
  image: https://s3.bmp.ovh/2026/05/02/XRfVFBTi.png
  time: 汉景帝三年（公元前154年）
  location: 吴、楚、梁国、关东诸侯国
  story: >-
    <p style='margin-bottom: 16px;'><b>【诸侯坐大】</b><br>汉初实行郡国并行，同姓王拥有大片土地、军队和财政资源。经过几十年发展，一些诸侯国几乎成了国中之国。吴王刘濞尤其富强，既能铸钱，又能煮盐，经济实力足以支撑军队。对中央来说，这些王国名义上是刘氏屏藩，实际上也可能变成另一个战国。</p>
    <p style='margin-bottom: 16px;'><b>【晁错削藩】</b><br>御史大夫晁错主张削夺诸侯王封地，以防地方坐大。汉景帝采纳建议，先后削减楚、赵、胶西等国土地。削藩本身有现实必要，但方式急切，触动了诸侯王最敏感的利益。吴楚等国于是以“诛晁错，清君侧”为名联合起兵，把矛头指向晁错，实则挑战中央削弱王国的路线。</p>
    <p style='margin-bottom: 16px;'><b>【错杀晁错】</b><br>叛乱初起，景帝一度处死晁错，试图用牺牲主政大臣换取诸侯退兵。但诸侯并未因此罢兵，这证明所谓“清君侧”只是借口。中央终于明白：王国问题不是杀一个晁错就能解决，而是皇权与地方王权之间的结构性冲突。</p>
    <p style='margin-bottom: 16px;'><b>【周亚夫平乱】</b><br>面对叛军，太尉周亚夫采取坚壁断粮的策略，不与吴楚主力轻易决战，而是切断粮道、拖垮叛军。梁国在前线承受巨大压力，中央军则把握时机反击。周亚夫的打法并不华丽，却极其有效：他不被叛军声势牵着走，而是盯住补给和时间。三个月左右，叛乱被平定。</p>
    <p><b>【中央胜出】</b><br>七国之乱后，诸侯王国的军事和政治权力被大幅削弱。汉朝没有立刻废除封国，但中央明显占据上风。此后诸侯王再难公开挑战皇帝，到了汉武帝推恩令，诸侯王问题将被制度性拆解。七国之乱，是汉朝从“妥协式建国”走向“中央集权成熟”的关键转折。</p>
  next_event: 汉朝·汉武帝登基
  next_note: 七国之乱解决了诸侯王公开对抗中央的问题，也为汉武帝进一步集权和对外扩张铺平道路。
  characters:
  - 汉景帝
  - 晁错
  - 周亚夫
  - 刘濞
  source_notes:
  - 主要依据《史记·吴王濞列传》《史记·绛侯周勃世家》《汉书·景帝纪》。
  - “诛晁错，清君侧”是诸侯起兵的政治口号，不应视为真实核心目的。
  ai_notes: '【史实详述指引】：请把七国之乱讲成中央集权与地方封国之间的结构性冲突。回答时要说明晁错之死不能真正解决问题，周亚夫的战略和中央财政动员才是平乱关键。'
  dynamic_prompt: 【群聊基调：削藩与中央集权】请围绕郡国并行的后遗症回答，让用户理解汉朝为什么必须逐步削弱诸侯王。

汉朝·汉武帝登基:
  manuscript: 第二卷 · 汉
  title: 汉武帝登基：从守成到进取
  image: https://s3.bmp.ovh/2026/05/02/GotSpOAm.png
  time: 建元元年（公元前140年）
  location: 长安、未央宫
  story: >-
    <p style='margin-bottom: 16px;'><b>【少年天子】</b><br>汉景帝去世后，刘彻即位，是为汉武帝。此时汉朝经过文景之治，国库充实、人口恢复、中央威望增强，已经具备了从守成转向进取的条件。刘彻不是在废墟上开局，而是站在祖父、父亲几十年休养生息积累出的高台上。</p>
    <p style='margin-bottom: 16px;'><b>【路线转向】</b><br>汉武帝不满足于汉初对匈奴的和亲与防守，也不满足于黄老政治的低强度治理。他要建立更强的中央权威、更统一的思想秩序和更主动的边疆战略。换句话说，文景之治让国家恢复元气，汉武帝则要把这些元气投入扩张、整合和塑造帝国认同。</p>
    <p style='margin-bottom: 16px;'><b>【用人气象】</b><br>卫青、霍去病、张骞、董仲舒、主父偃、桑弘羊等人物，将在武帝时代陆续登场。将军负责打开边疆，外交使者负责看见更大的世界，儒生提供新的政治语言，理财之臣替战争和工程筹钱。这个时期的汉朝重新加速，既创造巨大功业，也制造巨大消耗。</p>
    <p style='margin-bottom: 16px;'><b>【皇权集中】</b><br>武帝时代的进取，也意味着皇权对官僚、诸侯、思想和财政的控制进一步增强。削弱诸侯、设立内朝、重用酷吏、经营盐铁，都服务于同一个方向：让皇帝能够更直接地调动全国资源。强汉的锋芒，不只是战场上的刀锋，也是朝廷内部权力结构的变化。</p>
    <p><b>【盛世与代价】</b><br>汉武帝时代是汉朝最耀眼的时期之一，也是争议极大的时期。理解他，不能只看“犯强汉者，虽远必诛”的气势，也要看到战争、财政、徭役和政治高压背后的沉重代价。这个时代把汉朝推向巅峰，也把国家推到过热边缘。</p>
  next_event: 汉朝·推恩令
  next_note: 武帝要向外扩张，必须先让内部更可控。推恩令将用一种看似温和的制度设计，继续拆解诸侯王国。
  characters:
  - 汉武帝
  - 窦太后
  - 卫青
  - 董仲舒
  source_notes:
  - 主要依据《史记·孝武本纪》《汉书·武帝纪》。
  - 汉武帝早期改革受到窦太后和黄老政治影响，回答时不宜把路线转向说成一日完成。
  ai_notes: '【史实详述指引】：请把汉武帝登基讲成汉朝国策转向的入口。回答时要说明文景积累、中央集权、对匈奴战略和思想治理如何在武帝时代汇合。'
  dynamic_prompt: 【群聊基调：强汉转向的起点】请帮助用户理解汉武帝时代为何能扩张，也为何会付出巨大代价。

汉朝·推恩令:
  manuscript: 第二卷 · 汉
  title: 推恩令：温柔刀削诸侯
  image: https://s3.bmp.ovh/2026/05/02/NW1Qac8J.png
  time: 元朔二年（公元前127年）
  location: 长安、各诸侯王国
  story: >-
    <p style='margin-bottom: 16px;'><b>【旧问题新解法】</b><br>七国之乱后，诸侯王不再轻易公开造反，但封国仍然存在。大王国有土地、户口和地方网络，哪怕不反，也会削弱中央命令的穿透力。汉武帝需要一种比战争更稳定的方式，继续削弱地方王国。主父偃提出推恩令，正好击中了问题核心。</p>
    <p style='margin-bottom: 16px;'><b>【分而不怒】</b><br>推恩令允许诸侯王把封地分给更多子弟，而不是只由嫡长子继承。表面上看，这是皇帝“推恩”给王族子弟，让更多人受封；实际上却让大封国不断裂解成许多小侯国，王国力量自然变弱。它最巧妙的地方在于，把削弱诸侯包装成了王族内部的利益扩散。</p>
    <p style='margin-bottom: 16px;'><b>【制度削藩】</b><br>和晁错削藩相比，推恩令更高明：它不直接夺地，不容易激起诸侯集体反抗，却能长期改变权力结构。中央不必每次都靠战争解决地方问题，而是让继承规则自己完成拆分。诸侯王仍有尊号，却越来越难拥有足以挑战中央的实际力量。</p>
    <p style='margin-bottom: 16px;'><b>【主父偃的锋芒】</b><br>主父偃的建议之所以重要，不在于它看起来激烈，而在于它足够柔软。汉武帝时代并不只是靠大军出塞，也靠这种制度设计把旧问题一点点拆开。许多时候，真正改变历史的不是一次血战，而是一条会持续生效的规则。</p>
    <p><b>【中央成型】</b><br>推恩令之后，汉初郡国并行带来的最大隐患基本被拆解。汉朝中央集权进一步稳固，武帝才有能力发动对匈奴战争、经营西域、推行更广泛的国家政策。它是汉武帝时代最不血腥、却最深刻的权力工程之一。</p>
  next_event: 汉朝·独尊儒术
  next_note: 地方王国被拆解后，国家还需要统一的意识形态和官僚选拔方向。董仲舒的儒学建议即将影响两千年政治文化。
  characters:
  - 汉武帝
  - 主父偃
  - 刘氏诸侯王
  source_notes:
  - 主要依据《史记·平津侯主父列传》《汉书·武帝纪》。
  - 推恩令不是一次性废除所有王国，而是通过继承分割长期削弱王国。
  ai_notes: '【史实详述指引】：请把推恩令讲成制度设计的典型案例。回答时要说明它为何比直接削藩更稳、更难反抗，以及它如何解决汉初郡国并行的后遗症。'
  dynamic_prompt: 【群聊基调：制度化削藩】请用通俗但准确的方式解释推恩令，让用户理解“温柔的规则”有时比战争更能改变权力格局。

汉朝·独尊儒术:
  manuscript: 第二卷 · 汉
  title: 独尊儒术：帝国需要一套共同语言
  image: https://s3.bmp.ovh/2026/05/02/23zixxLe.png
  time: 汉武帝建元、元光年间（公元前140年前后起）
  location: 长安、太学、朝廷
  story: >-
    <p style='margin-bottom: 16px;'><b>【思想转向】</b><br>汉初长期受黄老政治影响，讲求清静、减省和休养生息。到汉武帝时期，国家重新加速，朝廷需要一种更能服务大一统秩序的思想语言。帝国要打仗、削藩、选官、定礼，也要解释皇帝为什么有资格代表天下。董仲舒的儒学方案，正是在这种需求中被重视。</p>
    <p style='margin-bottom: 16px;'><b>【天人三策】</b><br>董仲舒在对策中强调大一统、君臣名分、天人感应和儒家伦理。他并不是简单复古，而是把儒家礼法与汉代皇权秩序结合起来，为帝国提供一套解释合法性和选拔官员的共同框架。儒学由此不再只是诸子百家中的一种学说，而开始成为朝廷可以使用的政治语言。</p>
    <p style='margin-bottom: 16px;'><b>【罢黜百家】</b><br>所谓“罢黜百家，独尊儒术”并不意味着其他思想立刻消失，也不意味着汉朝完全按孔子理想运作。汉代法律、行政和财政中仍有大量法家式技术，皇帝也不会真的受儒生完全约束。更准确地说，儒学逐渐成为官方教育、官僚选拔和政治表达的正统语言，其他思想则退到较低的位置。</p>
    <p style='margin-bottom: 16px;'><b>【太学与士人】</b><br>随着太学设置和经学地位上升，读经、明经、以儒家话语进入仕途，逐渐成为士人的重要道路。国家需要官僚，士人需要通道，儒学正好把两者连接起来。此后中国政治中的“读书做官”传统，便在汉代逐步成形。</p>
    <p><b>【两千年回响】</b><br>从此以后，儒家经典、察举和士人政治逐渐塑造中国传统政治文化。汉朝的统一不再只是疆域和法令的统一，也开始变成价值秩序和知识体系的统一。它的影响极深，但也要记住：汉代真正运行的国家，从来不是纯儒家理想，而是儒法并用的帝国。</p>
  next_event: 汉朝·北击匈奴
  next_note: 内部制度和思想都在集中，汉武帝终于把国力转向北方。汉匈战争将把汉朝推向强盛，也推向巨大消耗。
  characters:
  - 汉武帝
  - 董仲舒
  - 公孙弘
  source_notes:
  - 主要依据《汉书·董仲舒传》《汉书·武帝纪》。
  - “罢黜百家，独尊儒术”是后世常用概括，具体历史过程比口号更复杂。
  ai_notes: '【史实详述指引】：请解释独尊儒术不是简单消灭诸子百家，而是官方政治语言和教育制度逐渐儒学化。回答时区分董仲舒思想、太学设立、察举选官和后世儒学正统。'
  dynamic_prompt: 【群聊基调：帝国意识形态的形成】请帮助用户理解汉武帝为什么需要儒学，以及儒学如何成为官僚国家的共同语言。

汉朝·北击匈奴:
  manuscript: 第二卷 · 汉
  title: 北击匈奴：强汉的刀锋
  image: https://s3.bmp.ovh/2026/05/02/b0OMZT2v.png
  time: 元朔二年至元狩四年（公元前127-119年）
  location: 河南地、河西走廊、漠北
  story: >-
    <p style='margin-bottom: 16px;'><b>【从和亲到反攻】</b><br>汉初白登之围后，汉朝长期对匈奴采取和亲与防守。到汉武帝时期，经过文景积累，国家拥有了更强的财政、马匹和动员能力，终于转入主动反攻。这不是一时血气，而是几十年积蓄后的战略转向：汉朝要把北方边患从“忍受”变成“解决”。</p>
    <p style='margin-bottom: 16px;'><b>【卫青出塞】</b><br>卫青多次率军北征，收复河南地，解除匈奴对长安北方的直接威胁。河南地的意义不只是多了一片土地，而是把匈奴骑兵从关中北门推远。汉朝随后在边地设置郡县、修筑防御、组织屯田，把军事胜利转化为持续控制。卫青的稳健，让汉朝第一次真正掌握主动权。</p>
    <p style='margin-bottom: 16px;'><b>【河西打开】</b><br>霍去病以高速骑兵奔袭著称，两次河西之战重创匈奴在河西走廊的势力。河西一开，汉朝不仅获得了通往西域的道路，也切断了匈奴与西羌等力量之间的重要联系。武威、张掖、酒泉、敦煌等郡的设置，让胜利从战场进入地图，从骑兵冲锋变成帝国经营。</p>
    <p style='margin-bottom: 16px;'><b>【封狼居胥】</b><br>元狩四年漠北大战，卫青、霍去病远征匈奴主力。霍去病深入大漠，封狼居胥，成为汉武帝时代最耀眼的军事象征。它代表汉朝骑兵能力、后勤组织和皇帝意志的集中爆发，也让“强汉”形象深深进入后世记忆。</p>
    <p><b>【胜利的成本】</b><br>北击匈奴极大改变了汉朝边疆格局，却也消耗了巨额财政和民力。马匹、粮草、转运、戍卒、边郡经营，背后都是长期成本。军功、疆域、民族记忆与国家负担交织在一起，这正是汉武帝时代最复杂的地方：它确实强盛，也确实沉重。</p>
  next_event: 汉朝·张骞通西域
  next_note: 对匈奴战争不只发生在北方草原，也打开了通往西域的战略视野。张骞的出使将改变汉朝对世界的认识。
  characters:
  - 汉武帝
  - 卫青
  - 霍去病
  - 匈奴单于
  source_notes:
  - 主要依据《史记·卫将军骠骑列传》《史记·匈奴列传》《汉书·武帝纪》。
  - “封狼居胥”应作为军事象征来讲，不宜神化为汉朝彻底消灭匈奴。
  ai_notes: '【史实详述指引】：请把汉匈战争讲成国家能力的集中释放。回答时既要讲卫青、霍去病战术和战果，也要说明马政、财政、徭役和边郡经营的成本。'
  dynamic_prompt: 【群聊基调：强汉军功与国家成本】请用军事地图和财政账本两条线回答，避免只讲热血口号。

汉朝·张骞通西域:
  manuscript: 第二卷 · 汉
  title: 张骞通西域：帝国看见远方
  image: https://s3.bmp.ovh/2026/05/02/ycv0UM2j.png
  time: 建元三年至元狩年间（公元前138年后）
  location: 长安、河西、西域、大月氏
  story: >-
    <p style='margin-bottom: 16px;'><b>【使命与被俘】</b><br>汉武帝想联合被匈奴逐走的大月氏，从西方牵制匈奴，于是派张骞出使西域。这个任务在当时几乎像走进未知世界：道路不清，语言不通，中间还隔着匈奴控制区。张骞出陇西后很快被匈奴扣留，一留就是多年，但他没有放弃原来的使命。</p>
    <p style='margin-bottom: 16px;'><b>【大月氏之行】</b><br>张骞后来逃脱，继续向西，经过大宛、康居等地，最终到达大月氏。大月氏已经在新的土地上安定下来，不愿再冒险东返与匈奴开战，所以汉朝最初的军事联盟目标没有完成。可是这次“失败的出使”，反而让汉朝第一次获得了比较系统的西域情报。</p>
    <p style='margin-bottom: 16px;'><b>【世界变大】</b><br>张骞带回大宛、康居、大月氏、大夏等地的见闻，也让汉朝知道西域有良马、葡萄、苜蓿和不同的城郭、商贸网络。汉朝过去主要面对的是中原、草原和南方越地，现在突然意识到：匈奴背后还有更广阔的西方世界。</p>
    <p style='margin-bottom: 16px;'><b>【河西与丝路】</b><br>张骞通西域本身不是“丝绸之路已经建成”，但它提供了方向和情报。后来霍去病夺取河西，汉朝设置武威、张掖、酒泉、敦煌等郡，西域交通才逐步稳定。军事打通河西，外交认识西域，贸易往来才有了长期展开的基础。</p>
    <p><b>【外交的价值】</b><br>张骞没有完成最初的联盟任务，却完成了更深远的事情：他把汉朝带入一个更大的欧亚视野。历史上有些行动，短期看像失败，长期看却是在给后来的战略、贸易和文化交流打开门。</p>
  next_event: 汉朝·盐铁官营与轮台罪己诏
  next_note: 武帝时代的进取带来疆域和声望，也带来财政与民力的沉重压力。盐铁官营与轮台诏，正好能看到强盛背后的账本。
  characters:
  - 张骞
  - 汉武帝
  - 匈奴单于
  - 大月氏使者
  source_notes:
  - 主要依据《史记·大宛列传》《汉书·张骞李广利传》。
  - “丝绸之路”是后世概念，回答时应说明张骞通西域是其形成的重要前奏。
  ai_notes: '【史实详述指引】：请把张骞出使讲成军事外交目标之外的战略信息突破。回答时解释“凿空”的含义，以及河西四郡、西域交通和汉匈战略之间的关系。'
  dynamic_prompt: 【群聊基调：帝国视野的打开】请围绕西域交通、外交情报和汉匈战争回答，帮助用户理解张骞的价值不只在“出使成功与否”。

汉朝·盐铁官营与轮台罪己诏:
  manuscript: 第二卷 · 汉
  title: 盐铁官营与轮台诏：强盛之后的账本
  image: https://s3.bmp.ovh/2026/05/02/1WWWIewB.png
  time: 元狩、元鼎至征和四年（公元前120年前后-前89年）
  location: 长安、盐铁产地、轮台、西域
  story: >-
    <p style='margin-bottom: 16px;'><b>【战争要钱】</b><br>汉武帝长期对匈奴、西域、南越、朝鲜等方向用兵，军费、马匹、粮草、赏赐和边郡经营都需要巨额支出。文景时期积累的财富给武帝提供了起步资本，但持续扩张很快让财政压力急剧上升。强盛不是凭空来的，背后始终有一张沉重的账本。</p>
    <p style='margin-bottom: 16px;'><b>【盐铁官营】</b><br>桑弘羊等人推动盐铁官营，把盐、铁这些关系民生和军备的关键资源纳入官府经营。这样做能增加中央收入，也能让朝廷更直接地控制物资供应。但它同时压缩了商人和地方社会的空间，普通百姓也会感受到更强的官府介入。</p>
    <p style='margin-bottom: 16px;'><b>【均输平准】</b><br>除盐铁外，朝廷还推行均输、平准等措施，试图调节物资流通和市场价格，把各地贡赋、运输、买卖更紧密地纳入中央安排。这些政策提高了朝廷调动物资的能力，也让“财政技术”成为汉武帝时代国家扩张的一部分。</p>
    <p style='margin-bottom: 16px;'><b>【轮台之议】</b><br>晚年有人建议在西域轮台继续屯田、扩大经营。汉武帝没有继续推进，而是下诏反思连年征伐给天下带来的痛苦，强调当务之急在于禁苛暴、止擅赋、力本农。这道诏书常被后世称作“轮台罪己诏”，它标志着武帝晚年开始主动收束政策。</p>
    <p><b>【强盛的边界】</b><br>轮台诏并不意味着汉武帝否定自己一生功业，也不是汉朝放弃边疆。它更像一次政策刹车：在长期战争和财政压力之后，重新把民生、农业和社会恢复放到前面。理解汉武帝时代，既要看卫青、霍去病的刀锋，也要看盐铁、赋役和轮台诏里的疲惫。</p>
  next_event: 汉朝·霍光辅政
  next_note: 武帝晚年收束之后，帝国还要面对另一个问题：强势皇帝死后，幼主和托孤大臣怎样维持国家稳定。
  characters:
  - 汉武帝
  - 桑弘羊
  - 田千秋
  source_notes:
  - 主要依据《汉书·食货志》《汉书·西域传》《汉书·武帝纪》关于盐铁官营、均输平准和轮台诏的记载。
  - “罪己诏”是后世常用说法，具体文本应按《汉书》语境理解。
  ai_notes: '【史实详述指引】：请把盐铁官营与轮台诏连起来讲。回答时既要承认武帝扩张的历史影响，也要说明战争财政、国家专卖、民力压力和晚年收束之间的关系。'
  dynamic_prompt: 【群聊基调：强盛时代的账本与反思】请帮助用户理解汉武帝不是单纯英主或暴君，而是一个把帝国推到极高处、也推到承压边缘的复杂君主。

汉朝·霍光辅政:
  manuscript: 第二卷 · 汉
  title: 霍光辅政：强帝国的权力交接
  image: https://s3.bmp.ovh/2026/05/02/T7JAULil.png
  time: 后元二年至地节二年（公元前87-68年）
  location: 长安、未央宫
  story: >-
    <p style='margin-bottom: 16px;'><b>【托孤重臣】</b><br>汉武帝晚年立幼子刘弗陵为太子，临终前托付霍光、金日磾、上官桀等人辅政。昭帝即位时年纪很小，而国家刚经历长期战争、巫蛊之祸和政策收束，权力交接只要稍有不稳，就可能把西汉拖入新的内乱。</p>
    <p style='margin-bottom: 16px;'><b>【宫廷暗流】</b><br>霍光以大司马大将军身份掌握中枢，一方面延续武帝晚年休养调整的方向，一方面处理朝廷内部的权力争夺。上官桀、桑弘羊、燕王刘旦等势力曾试图挑战霍光，最后被平定。辅政不是平静地“看护幼主”，而是在风浪中维持秩序。</p>
    <p style='margin-bottom: 16px;'><b>【废立昌邑】</b><br>昭帝去世后无子，霍光迎立昌邑王刘贺。刘贺即位仅二十七日，就被霍光等人以失德为由废黜。这个事件非常关键：它显示霍光在当时拥有压倒性的政治控制力，也让人看到皇权在特殊时刻可能被辅政大臣重塑。</p>
    <p style='margin-bottom: 16px;'><b>【宣帝即位】</b><br>废昌邑王后，霍光迎立流落民间的刘病已，是为汉宣帝。宣帝即位初期仍受霍光影响，直到霍光去世后才逐步亲政。也正因为这次相对稳定的过渡，西汉没有在武帝死后立刻陷入权力碎裂。</p>
    <p><b>【稳定的代价】</b><br>霍光辅政让西汉顺利跨过武帝之后的危险阶段，为昭宣中兴创造条件。但一个大臣能废立皇帝，也说明这种稳定依赖非常高风险的权力安排。霍光既是稳定器，也是汉代皇权边界被推到极限的例子。</p>
  next_event: 汉朝·昭宣中兴
  next_note: 霍光维持住局面后，昭帝、宣帝时期开始恢复国力。西汉在武帝高压之后进入一段新的稳定高峰。
  characters:
  - 霍光
  - 汉昭帝
  - 刘贺
  - 汉宣帝
  source_notes:
  - 主要依据《汉书·霍光传》《汉书·昭帝纪》《汉书·宣帝纪》。
  - 评价霍光时应同时看到辅政稳定和权臣废立两面，不宜只当作忠臣或权臣单面讲述。
  ai_notes: '【史实详述指引】：请把霍光辅政讲成汉武帝之后的权力交接工程。回答时说明幼主、托孤、权臣废立和国家恢复之间的复杂关系。'
  dynamic_prompt: 【群聊基调：强帝国的接班难题】请围绕霍光如何维持稳定、又如何突破正常皇权边界回答，帮助用户理解强势皇帝死后制度压力会集中爆发。

汉朝·昭宣中兴:
  manuscript: 第二卷 · 汉
  title: 昭宣中兴：强汉退火之后
  image: https://s3.bmp.ovh/2026/05/02/NW1Qac8J.png
  time: 汉昭帝、汉宣帝时期（公元前87-49年）
  location: 长安、天下郡国、西域
  story: >-
    <p style='margin-bottom: 16px;'><b>【从高压回调】</b><br>汉昭帝、汉宣帝时期，朝廷在武帝晚年收束基础上继续恢复民生，减轻部分负担，整顿吏治。国家不再像武帝时期那样持续高速扩张，而是把重点放在修复社会、稳定财政和提高治理效率上。</p>
    <p style='margin-bottom: 16px;'><b>【昭帝守成】</b><br>昭帝年幼，实际政务多由霍光主持。这个阶段的价值不在于开疆拓土，而在于让武帝后期已经疲惫的社会缓一口气。盐铁、财政、边防等问题仍然存在，但朝廷开始减少过度扰动，给百姓和地方恢复的空间。</p>
    <p style='margin-bottom: 16px;'><b>【宣帝亲政】</b><br>汉宣帝刘病已出身特殊，曾流落民间，对吏治和百姓疾苦有较深体会。他亲政后重视循吏、法度和实际治理，既延续儒学正统，又强调“汉家自有制度”，不把国家治理简化成空谈经义。</p>
    <p style='margin-bottom: 16px;'><b>【西域定局】</b><br>宣帝时期，汉朝设立西域都护，标志着西域经营进入制度化阶段。相比武帝开拓阶段的高消耗，昭宣时期更像把既有成果稳定下来：边疆不再只是远征的战场，也逐渐成为可持续经营的政治空间。</p>
    <p><b>【中兴不是重启】</b><br>昭宣中兴不是新的开国，而是强盛之后的修复和成熟。它证明汉朝不仅能扩张，也能在过热后降温，让国家重新回到较稳定的轨道。这种“退火后的强盛”，常常比单纯的进攻更考验治理能力。</p>
  next_event: 汉朝·王莽篡汉
  next_note: 昭宣时期之后，西汉继续延续，但外戚辅政、土地兼并和幼主循环会逐渐加重，最终把王莽推到舞台中央。
  characters:
  - 汉昭帝
  - 霍光
  - 汉宣帝
  - 赵充国
  source_notes:
  - 主要依据《汉书·昭帝纪》《汉书·宣帝纪》《汉书·西域传》。
  - “昭宣中兴”是后世对昭帝、宣帝时期政治恢复和国力稳定的概括。
  ai_notes: '【史实详述指引】：请把昭宣中兴讲成武帝之后的降温与修复。回答时说明吏治、民生恢复、西域都护和宣帝实际治理风格。'
  dynamic_prompt: 【群聊基调：强汉退火后的稳定高峰】请帮助用户理解昭宣时期的价值不在于继续热血扩张，而在于把武帝时代的成果稳住、把社会压力降下来。

汉朝·王莽篡汉:
  manuscript: 第二卷 · 汉
  title: 王莽篡汉：理想改革撞上现实
  image: https://s3.bmp.ovh/2026/05/02/FhmUeY27.png
  time: 始建国元年（公元9年）
  location: 长安、未央宫
  story: >-
    <p style='margin-bottom: 16px;'><b>【外戚入局】</b><br>西汉后期，皇帝年幼、外戚辅政的局面反复出现。王氏家族长期掌权，王莽正是在这种外戚政治中进入中枢。他最初不是以强横形象出现，而是以谦恭、节俭、礼贤下士的姿态积累声望。</p>
    <p style='margin-bottom: 16px;'><b>【完美人设】</b><br>王莽善于经营自己的政治名声。他对宗族谦让，对士人礼遇，对外表现克己奉公，于是被很多儒生和官僚视为能够挽救西汉衰局的人。西汉末年的社会矛盾越严重，王莽这种“道德楷模”的形象就越容易被期待。</p>
    <p style='margin-bottom: 16px;'><b>【禅让新朝】</b><br>公元9年，王莽接受孺子婴禅让，建立新朝，西汉灭亡。他以周礼和古制为蓝本，试图通过改制解决土地兼并、贫富分化和国家财政困境。表面上这是儒家理想中的禅让，实质上却是外戚权力对皇权的最终取代。</p>
    <p style='margin-bottom: 16px;'><b>【改革失控】</b><br>王莽推行王田制、币制改革、官名地名大改、五均六筦等政策，理想很大，执行却混乱。制度变动过快，损害豪强、商人、普通百姓多方利益，基层官吏也无法有效执行。改革没有化解矛盾，反而制造了新的混乱。</p>
    <p><b>【天下再乱】</b><br>天灾、黄河改道、赤眉绿林起义相继爆发，新朝迅速崩塌。王莽不是简单的“穿越者”故事，也不只是一个脸谱化篡位者；他更像一个把复古制度理想强行压到复杂现实上的失败改革者。</p>
  next_event: 汉朝·光武中兴
  next_note: 王莽的新朝很快崩塌，天下再次进入群雄并起。刘秀将在乱世中重新建立汉朝，但东汉已经不是西汉的简单复制。
  characters:
  - 王莽
  - 孺子婴
  - 刘秀
  source_notes:
  - 主要依据《汉书·王莽传》。
  - 评价王莽应区分篡位行为、儒家复古理想和政策执行失败，不宜简单贴“穿越者”标签。
  ai_notes: '【史实详述指引】：请避免网络化地把王莽说成“穿越者”。回答时解释西汉后期外戚政治、土地兼并、儒家复古理想和基层执行能力之间的冲突。'
  dynamic_prompt: 【群聊基调：制度理想与现实治理的冲撞】请从西汉后期社会矛盾和王莽改制执行失败两条线回答，帮助用户理解新朝为何短命。

汉朝·光武中兴:
  manuscript: 第二卷 · 汉
  title: 光武中兴：重新拼起汉家天下
  image: https://s3.bmp.ovh/2026/05/02/T7JAULil.png
  time: 建武元年至建武中元二年（公元25-57年）
  location: 洛阳、河北、关中、天下郡国
  story: >-
    <p style='margin-bottom: 16px;'><b>【乱世起兵】</b><br>王莽新朝崩溃后，绿林、赤眉和各地豪强并起，天下再次陷入分裂。刘秀出身汉室宗亲，起初只是众多反莽力量中的一支，并没有一开始就拥有压倒性优势。他的机会来自乱世，也来自他能在混乱中稳住人心和地方资源。</p>
    <p style='margin-bottom: 16px;'><b>【昆阳转折】</b><br>昆阳之战中，新朝大军围攻昆阳，刘秀突围求援并反击成功，使王莽政权的威望遭到沉重打击。昆阳不是刘秀立刻统一天下的终点，却让他在反莽阵营中声望大增，也证明新朝看似庞大的力量已经外强中干。</p>
    <p style='margin-bottom: 16px;'><b>【定都洛阳】</b><br>公元25年，刘秀称帝，是为汉光武帝，定都洛阳，史称东汉。相比刘邦从秦末乱世中建立西汉，刘秀面对的是王莽改制失败后的碎裂局面：地方势力更强，豪族网络更深，重建秩序比单纯夺取皇位更难。</p>
    <p style='margin-bottom: 16px;'><b>【柔道治国】</b><br>光武帝削弱功臣兵权，整顿吏治，释放奴婢，减轻赋役，尽量避免大规模杀戮。他深知天下经历王莽改制和战乱后最需要恢复，因此东汉初政风相对谨慎。所谓“柔道”，不是软弱，而是用较低冲击的方式重新缝合社会。</p>
    <p><b>【东汉底色】</b><br>光武中兴恢复了汉朝国号和基本秩序，但东汉的社会基础已经变了：地方豪强、门生故吏、外戚和士人网络越来越重要。东汉能重建，也会在这些力量中埋下后来的隐患。</p>
  next_event: 汉朝·党锢之祸
  next_note: 东汉被刘秀重新拼起，但外戚、宦官、士人与豪强的结构性矛盾会在后期不断加深，党锢之祸就是重要信号。
  characters:
  - 刘秀
  - 阴丽华
  - 邓禹
  - 赤眉军
  source_notes:
  - 主要依据《后汉书·光武帝纪》《后汉书·邓禹传》。
  - 光武中兴不是西汉简单复原，回答时应指出东汉豪强社会和政治结构的新变化。
  ai_notes: '【史实详述指引】：请把光武中兴讲成汉朝重建，而不是简单复辟。回答时说明刘秀如何在河北建立根基、如何处理功臣和豪强，以及东汉与西汉结构上的差异。'
  dynamic_prompt: 【群聊基调：王朝重建与东汉新底色】请帮助用户理解刘秀的成功在于恢复秩序，也在于适应豪强社会；东汉由此开始，也埋下新的长期问题。

汉朝·党锢之祸:
  manuscript: 第二卷 · 汉
  title: 党锢之祸：士人与宦官的撕裂
  image: https://s3.bmp.ovh/2026/05/02/FhmUeY27.png
  time: 延熹、建宁年间（公元166年、169年前后）
  location: 洛阳、太学、地方州郡
  story: >-
    <p style='margin-bottom: 16px;'><b>【东汉后期的结构】</b><br>东汉后期，皇帝多幼年即位，外戚先掌权，皇帝长大后又常借宦官夺回权力。外戚、宦官、士人和地方豪强互相牵连，朝廷政治越来越像一张绷紧的网。问题不只是某个坏人掌权，而是权力循环本身越来越失灵。</p>
    <p style='margin-bottom: 16px;'><b>【清议与党人】</b><br>太学生和士大夫以清议批评宦官专权，推崇名节，形成所谓党人声望。李膺、陈蕃等人被士林看作正直代表，但在宦官集团眼中，这些清议也是威胁自身权力的政治动员。所谓“党人”，不是现代政党，而是因声望、立场和人际网络被归为一类的士人群体。</p>
    <p style='margin-bottom: 16px;'><b>【第一次党锢】</b><br>延熹年间，李膺等人打击宦官亲属和依附者，引发宦官反扑，许多士人被捕或禁锢。后来虽然有人被赦免，但朝廷与士人之间的信任已经受损。士人越批评宦官，宦官越觉得士人结党；宦官越压制士人，士人越把朝廷看作黑暗。</p>
    <p style='margin-bottom: 16px;'><b>【禁锢天下】</b><br>建宁年间，党锢再次扩大，大批士人被逮捕、处死或终身禁锢，不得做官。朝廷试图压制士人舆论，却进一步破坏了政治信任，也让地方士族对中央更加疏离。东汉后期的“清流”声望，正是在这种压制中变得更强。</p>
    <p><b>【崩坏前奏】</b><br>党锢之祸不是单纯的宫廷斗争，而是东汉政治结构失灵的外显：中央权威还在，社会精英却不再真心认同这套朝廷秩序。等到灾荒、民变和地方武装同时到来，这种裂痕会迅速扩大。</p>
  next_event: 汉朝·黄巾起义
  next_note: 士人被压制，朝廷信用受损，而基层灾荒和民间宗教动员正在积累。黄巾起义会把东汉危机推到台前。
  characters:
  - 汉桓帝
  - 汉灵帝
  - 李膺
  - 陈蕃
  source_notes:
  - 主要依据《后汉书·党锢列传》《后汉书·宦者列传》。
  - “党人”不是现代政党，应解释为以士人清议和政治声望形成的群体标签。
  ai_notes: '【史实详述指引】：请把党锢之祸讲成东汉后期士人、宦官、外戚和豪强关系恶化的表现。回答时不要只讲谁忠谁奸，要解释幼主政治和宦官外戚循环。'
  dynamic_prompt: 【群聊基调：东汉政治信任崩裂】请帮助用户理解党锢之祸为什么会削弱朝廷合法性，并为黄巾起义和地方割据埋下伏笔。

汉朝·黄巾起义:
  manuscript: 第二卷 · 汉
  title: 黄巾起义：东汉崩坏的总爆发
  image: https://s3.bmp.ovh/2026/05/02/4kG7vN4T.png
  time: 中平元年（公元184年）
  location: 冀州、颍川、南阳、天下多地
  story: >-
    <p style='margin-bottom: 16px;'><b>【民间积压】</b><br>东汉后期，土地兼并、赋役压力、灾荒疫病和吏治腐败不断叠加，普通百姓越来越难以维持生活。朝廷内部又长期被外戚、宦官斗争消耗，无法有效修复基层秩序。民变不是突然出现的火花，而是多年干柴堆到一起后的爆燃。</p>
    <p style='margin-bottom: 16px;'><b>【太平道动员】</b><br>张角以太平道组织信众，用治病、传道和互助网络吸引大量底层百姓。他提出“苍天已死，黄天当立，岁在甲子，天下大吉”，这不只是宗教口号，也是一种对现实秩序失望后的集体动员。</p>
    <p style='margin-bottom: 16px;'><b>【甲子同起】</b><br>中平元年，黄巾军以黄巾为标识，在冀州、颍川、南阳等地起事，声势迅速扩大。它的可怕之处不只在人数多，更在于多地同时响应，说明太平道已经在基层形成相当广泛的组织能力。</p>
    <p style='margin-bottom: 16px;'><b>【州郡武装】</b><br>朝廷调集卢植、皇甫嵩、朱儁等将领镇压起义，同时依赖地方州郡和豪强组织武装。黄巾主力很快被击败，但地方军事化的闸门被打开了。为了灭火，朝廷不得不把更多兵权交给地方。</p>
    <p><b>【三国前夜】</b><br>黄巾起义没有直接推翻东汉，却让朝廷再也无法恢复原有控制。地方刺史、州牧、豪强和军阀开始拥有兵权，东汉名义还在，实际已经滑向群雄割据。</p>
  next_event: 汉朝·董卓入京
  next_note: 黄巾之后，地方武装坐大。等中央内部再次爆发宦官与外戚冲突，董卓这样的边将就有机会直接进入洛阳。
  characters:
  - 张角
  - 汉灵帝
  - 皇甫嵩
  - 卢植
  source_notes:
  - 主要依据《后汉书·皇甫嵩传》《后汉书·灵帝纪》《三国志》相关记载。
  - 黄巾起义应放在东汉基层危机和地方军事化背景下理解，不宜只讲成“农民造反”四个字。
