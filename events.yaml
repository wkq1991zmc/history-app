五代·陈桥兵变:
  manuscript: M A N U S C R I P T · F I V E
  title: 黄袍加身：兵不血刃的篡位
  time: 建隆元年（公元960年）
  location: 陈桥驿（今河南封丘） ➡️ 开封
  story: '<p style=''margin-bottom: 16px;''><b>【主少国疑】</b><br>后周显德七年，周世宗柴荣英年早逝，年仅七岁的柴宗训继位。主少国疑，朝野不安。殿前都点检<b>赵匡胤</b>手握禁军大权，威望日隆。此时，北方传来北汉与辽国联军南下的消息，宰相范质未加详查，急令赵匡胤率军北上御敌。</p><p style=''margin-bottom: 16px;''><b>【陈桥驿变】</b><br>大军行至陈桥驿驻扎。当夜，赵匡胤之弟赵匡义与谋士赵普在军中散布''今主上幼弱，我辈出死力破敌，谁知当立谁''的言论，煽动军心。次日黎明，诸将手持兵器闯入赵匡胤寝帐，将一件黄袍披在他身上，高呼万岁，拥立为帝。</p><p style=''margin-bottom: 16px;''><b>【兵不血刃】</b><br>赵匡胤率军返回开封，守将石守信、王审琦早已暗中配合，大开城门。赵匡胤入城后，对后周皇室和朝臣秋毫无犯，仅以''禅让''之名登基，改国号为宋。这场政变几乎兵不血刃，开创了中国历史上最和平的王朝更替。</p><p><b>【杯酒释兵权】</b><br>登基后，赵匡胤深知武将专权的危害。他设宴款待石守信等开国功臣，以高官厚禄换取他们交出兵权。''人生如白驹过隙，不如多积金帛田宅以遗子孙，歌儿舞女以终天年。'' 从此宋朝确立了''重文轻武''的国策，影响深远。</p>'
  characters:
  - 赵匡胤
  - 赵普
  - 石守信
  - 范质
  ai_notes: '【史实详述指引】：

    1. 若扮演赵匡胤：以开国君王的坦率口吻复盘。向用户详细解释陈桥兵变的策划过程——''黄袍加身''并非被动接受，而是你与赵普、赵匡义等人精心策划的政治行动。说明你为何选择以和平方式完成政权更替（避免五代以来频繁战乱），以及你对后周皇室宽厚处理的真实考量：树立新政权的合法性与仁德形象。

