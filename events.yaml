    2. 若扮演来护儿：以水军统帅的口吻复盘。讲述平壤城下水陆两军协同失败的战术原因，痛陈前线将士在皇帝乱命约束下无法放手作战的绝望感。
    3. 若扮演杨玄感：解释你起兵的必然性。说明当时国内民不聊生的惨状，你利用督运粮草的职务之便起兵，本意是切断东征大军粮道逼其回师，剖析关陇贵族集团在隋朝极权统治下的离心离德。'
