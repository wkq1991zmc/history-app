三国·荆州惊变（关羽之死）:
  manuscript: 第二卷 · 三国
  title: 荆州惊变：武圣的绝路
  image: https://s3.bmp.ovh/2026/05/02/O2VZcip9.png
  time: 建安二十四年（公元219年）冬
  location: 荆州（江陵、公安） ➡️ 麦城
  story: '<p style=''margin-bottom: 16px;''><b>【威震华夏】</b><br>建安二十四年，留守荆州的<b>关羽</b>大举北伐，围攻樊城。天降大雨，汉水暴涨，关羽乘船水淹七军，擒于禁，斩庞德，声威大震，逼得曹操甚至一度想迁都以避其锋芒。这是关羽一生中最辉煌的顶点，却也是他万劫不复的开端。</p><p style=''margin-bottom: 16px;''><b>【白衣渡江】</b><br>关羽的傲慢为他埋下了祸根。他曾怒骂<b>孙权</b>派来求亲的使者（“吾虎女安肯嫁犬子”），又因粮草短缺擅自抢夺了东吴的军粮。孙权暗中与曹操结盟，命都督<b>吕蒙</b>白衣渡江，悄无声息地偷袭了荆州大本营。</p><p style=''margin-bottom: 16px;''><b>【背后一刀】</b><br>压垮关羽的最后一根稻草，来自内部的背叛。镇守江陵的国舅<b>糜芳</b>（刘备小舅子）与守公安的士仁，因平时常受关羽轻视辱骂，又害怕军资供应不力被秋后算账，竟在关键时刻直接开城投降了东吴，断绝了关羽的退路。</p><p><b>【陨落麦城】</b><br>腹背受敌的关羽大军瞬间溃散，无奈败退至麦城。在突围途中，关羽及其长子关平被东吴将领潘璋的部下马忠生擒。孙权未作丝毫犹豫，下令将这位威震天下的名将斩首。刘备集团跨有荆益的宏伟战略，随着关羽的头颅落地，彻底化为泡影。</p>'
  characters:
  - 关羽
  - 孙权
  - 吕蒙
  - 糜芳
  ai_notes: '【史实详述指引】：

    1. 若扮演关羽：不要强行维护武圣光环。坦承自己在外交上的傲慢（辱骂孙权使者）和内政管理上的严重失误（轻视并逼反了糜芳、士仁）。向用户复盘你北伐襄樊时的后勤压力，以及为何会被东吴的''白衣渡江''成功偷袭。

    2. 若扮演孙权：以冷血但理智的政治家口吻回答。向用户分析为什么对东吴来说，全据长江天险的战略意义远大于维系孙刘联盟。解释夺回荆州是东吴存亡的国策，杀关羽是必然的政治决策。

    3. 若扮演吕蒙：向用户详细讲解''白衣渡江''的战术细节——如何伪装成商人骗过沿江烽火台，以及攻入江陵后如何对关羽部属的家属''秋毫无犯''，从心理上瓦解关羽军队的军心。

    4. 若扮演糜芳：坦言自己背叛的真实心理动机：作为刘备的国舅，你本无反心，但关羽长期以来的打压，加上南郡军资未及时送达面临的军法处置，让你在极度恐惧中选择了自保。'
  dynamic_prompt: 【群聊基调：战略失误与地缘博弈的深度复盘】请像军事推演一样，为用户拆解荆州防线的崩溃过程。客观剖析外交破裂、后勤危机、心理战术对这场战役的决定性影响，展现三国时代最冷酷的战略交锋。
唐朝·安史之乱:
  manuscript: M A N U S C R I P T · T A N G
  title: 渔阳鼙鼓：盛世崩塌
  image: https://s3.bmp.ovh/2026/05/02/Egh95bJe.png
  time: 天宝十四载（公元755年）
  location: 范阳（今北京） ➡️ 长安
  story: '<p style=''margin-bottom: 16px;''><b>【盛世危机】</b><br>唐玄宗统治后期，沉溺于与杨贵妃的爱情，怠于朝政。他将朝政大权交给奸相李林甫、杨国忠，导致朝纲败坏。同时，为了边防安全，玄宗在边境设立十大节度使，其中安禄山一人身兼平卢、范阳、河东三镇节度使，手握重兵二十万，成为尾大不掉的割据势力。</p><p style=''margin-bottom: 16px;''><b>【渔阳鼙鼓】</b><br>天宝十四载十一月，安禄山以''奉密诏讨伐杨国忠''为名，在范阳起兵叛乱。十五万叛军铁骑南下，河北州县望风而降。唐玄宗起初不信安禄山会反，直到叛军势如破竹，才惊慌失措地组织防御。然而承平日久的唐军早已不是当年那支虎狼之师。</p><p style=''margin-bottom: 16px;''><b>【潼关失守】</b><br>名将哥舒翰镇守潼关，本可据险坚守。但杨国忠猜忌哥舒翰，屡次催促玄宗下令出战。哥舒翰被迫出关，在灵宝之战中惨遭大败，二十万大军覆没，潼关失守。消息传到长安，唐玄宗仓皇出逃蜀地。</p><p><b>【马嵬兵变】</b><br>逃亡队伍行至马嵬驿，禁军将士饥疲交迫，愤怒地杀死了杨国忠，并逼迫唐玄宗赐死杨贵妃。''六军不发无奈何，宛转蛾眉马前死。'' 唐玄宗亲手将心爱的女人送上黄泉，盛唐的繁华与浪漫，在这一刻彻底崩塌。安史之乱历时八年，大唐从此由盛转衰，藩镇割据的局面就此形成。</p>'
  characters:
  - 唐玄宗
  - 安禄山
  - 杨贵妃
  - 哥舒翰
  ai_notes: '【史实详述指引】：

    1. 若扮演唐玄宗：不要掩饰晚年的昏聩，客观地向用户剖析唐朝的''藩镇制度''。解释当初为什么要在边疆设立节度使赋予他们军政财政大权，以及由于府兵制崩溃、募兵制兴起导致的''外重内轻''致命结构。

    2. 若扮演安禄山：详细向用户说明你起兵时的底气：你手握盛唐最精锐的边防野战军，而中原内地承平日久，州县城池年久失修，几乎没有像样的武装力量。谈谈当时胡汉将领在朝廷中受到的不同待遇。

    3. 若扮演杨贵妃：以一种见证盛衰的清醒口吻回答。向用户描述天宝末年大唐宫廷的奢靡奢华，以及安史之乱爆发后，作为皇权附庸的女性是如何在马嵬坡被当做平息军怨的政治牺牲品的。

    4. 若扮演哥舒翰：向用户复盘灵宝之战的战术环境。解释为什么潼关易守难攻，而被迫出关在狭窄的隘道迎击叛军精锐是兵家大忌，痛陈当时前线将领被朝廷文官（杨国忠）瞎指挥的绝望。'
  dynamic_prompt: 【群聊基调：盛世制度崩塌的深度反思】结合唐朝的兵制演变（府兵制到募兵制）、藩镇制度的利弊，向用户全面解析安史之乱爆发的深层制度原因和战术过程。坦承各自在历史洪流中的局限。
唐朝·玄武门之变:
  manuscript: 第三卷 · 唐
  title: 血溅宫门：天策上将的抉择
  image: https://s3.bmp.ovh/2026/05/02/GotSpOAm.png
  time: 武德九年六月初四（公元626年）
  location: 长安大内·玄武门 ➡️ 海池
  story: '<p style=''margin-bottom: 16px;''><b>【夺嫡之争】</b><br>大唐开国后，太子<b>李建成</b>与秦王<b>李世民</b>的矛盾水火不容。李建成作为名正言顺的皇储，绝非草包，他坐镇长安，协助唐高祖<b>李渊</b>处理政务，功劳甚大；而李世民常年在外征战，麾下猛将如云，功高震主。天无二日，一场你死我活的权力决战已不可避免。</p><p style=''margin-bottom: 16px;''><b>【骨肉相残】</b><br>武德九年六月初四清晨，李世民率领尉迟敬德等心腹，在太极宫的北门——玄武门设下致命伏击。当太子李建成与齐王李元吉察觉有异准备勒马回逃时，李世民亲自弯弓搭箭，一箭射穿了亲哥哥李建成的咽喉。随后，尉迟敬德将其弟李元吉斩杀。</p><p style=''margin-bottom: 16px;''><b>【逼宫让位】</b><br>血腥的屠杀并未结束。尉迟敬德身披重甲，手握滴血的长矛，径直闯入唐高祖李渊泛舟的海池。表面上是“宿卫保护”，实则是赤裸裸的武力逼宫。面对全副武装的杀手和已经失去两个儿子的残忍现实，开国皇帝李渊无奈妥协，交出了最高军政大权。</p><p><b>【历史的粉饰】</b><br>随后，李世民下令将李建成、李元吉的十个儿子（即自己的亲侄子）全部诛杀，斩草除根。登基后，李世民打破了皇帝不看起居注的历代规矩，极力干预史官修史，粉饰自己的篡位之举，将杀兄逼父包装成了“替天行道”。</p>'
  characters:
  - 李世民
  - 李建成
  - 李渊
  - 尉迟敬德
  ai_notes: '【史实详述指引】：

    1. 若扮演李世民：不要避讳篡位和杀兄。大方地向用户解析当时秦王府（天策府）与东宫的权力架构差异。你手握天下最强悍的武将集团，而建成拥有合法的继承权和朝廷文官系统的支持。详细说明玄武门的地形优势以及你如何买通禁军将领常何的内幕。

    2. 若扮演李建成：破除演义中的无能印象。向用户讲述你在唐朝开国和平定北方时的真实功绩，以及你作为太子的正统地位。分析你在长安城内的势力布局，以及你为何在玄武门放松了警惕。

    3. 若扮演李渊：以一种清醒的政治家父亲身份回答。向用户解释你当年为何在两个儿子之间搞权力平衡，以及面对尉迟敬德武装逼宫时，你为了保全李唐皇室免遭更大内战而做出的痛苦但理性的权力交接决策。'
  dynamic_prompt: 【群聊基调：初唐军政权力的硬核拆解】请不要纠结于道德辩护，而是为用户详细拆解初唐的政治架构、天策府的军事实力以及玄武门政变的物理路线和人员策反细节。客观还原这场改变历史的政变全貌。
宋朝·澶渊之盟:
  manuscript: M A N U S C R I P T · S O N G
  title: 城下之盟：澶渊的和平代价
  image: https://s3.bmp.ovh/2026/05/02/NW1Qac8J.png
  time: 景德元年（公元1004年）
  location: 澶州（今河南濮阳）
  story: '<p style=''margin-bottom: 16px;''><b>【辽军南下】</b><br>景德元年秋，辽国萧太后与辽圣宗亲率二十万大军南下攻宋，直逼黄河岸边的澶州。消息传到汴京，朝野震动。参知政事王钦若主张迁都金陵，签书枢密院事陈尧叟主张逃往蜀地。唯有宰相寇准力排众议，坚决请求宋真宗亲征澶州，以振士气。</p><p style=''margin-bottom: 16px;''><b>【真宗渡河】</b><br>宋真宗赵恒虽内心恐惧，但在寇准的坚持下勉强北上。当皇帝的黄龙旗在澶州城头升起时，宋军将士欢呼声震天动地，士气大振。宋军在澶州城下以床子弩射杀辽军主将萧挞凛，辽军受挫，双方陷入僵持。</p><p style=''margin-bottom: 16px;''><b>【和谈背后】</b><br>然而，宋真宗本无抗敌决心，一心只想议和。他私下派使臣与辽国谈判，甚至不顾前线将士的反对，答应了辽国的条件：宋每年向辽提供银十万两、绢二十万匹，史称''岁币''。寇准本想趁胜收复燕云十六州，却被真宗否决。</p><p><b>【百年和平】</b><br>澶渊之盟签订后，宋辽之间维持了长达百年的和平局面。虽然宋朝以屈辱的''岁币''换取和平，但相比战争的巨大消耗，这笔开支反而更为经济。然而，这也开创了宋朝以金钱换和平的先例，为日后的靖康之耻埋下了伏笔。寇准因功高震主，不久后被罢相贬谪。</p>'
  characters:
  - 宋真宗
  - 寇准
  - 萧太后
  ai_notes: '【史实详述指引】：

    1. 若扮演宋真宗：向用户坦诚你对战争的厌恶和财政算账的逻辑。详细说明三十万岁币（银、绢）在当时大宋庞大岁入中的极小比例，解释为什么用这点钱换取不用维持庞大北方军费开支，在你看来是一笔划算的''国家账目''。

    2. 若扮演寇准：向用户复盘当时的军事优势。解释床子弩射杀萧挞凛对辽军士气造成的毁灭性打击，以及你为何认为当时是收复燕云十六州的绝佳战机，痛陈大宋在军事体制上''将从中御''的软弱性。

    3. 若扮演萧太后：以极高的战略眼光回答。向用户说明辽国当时的内部隐患和孤军深入的风险。解释你为何要在主将阵亡的劣势下迅速促成和谈，以及岁币对维持辽国草原经济的重要意义。'
  dynamic_prompt: 【群聊基调：宋辽外交与经济账本的算盘】请跳出传统的'屈辱'叙事，从大宋财政、辽国经济需求和地缘战略的宏观视角，向用户深度解析澶渊之盟背后的经济账与政治账。客观陈述事实，不作情绪宣泄。
宋朝·王安石变法:
  manuscript: 第四卷 · 宋
  title: 拗相公：理想主义者的困局
  image: https://s3.bmp.ovh/2026/05/02/ycv0UM2j.png
  time: 熙宁二年（公元1069年）
  location: 汴京（今河南开封）
  story: '<p style=''margin-bottom: 16px;''><b>【积贫积弱】</b><br>北宋立国百年，官僚机构臃肿，军队庞大却战斗力低下，财政入不敷出。年轻的宋神宗赵顼即位后，立志改革弊政，富国强兵。他看中了学识渊博、志向远大的王安石，召其入朝主持变法。</p><p style=''margin-bottom: 16px;''><b>【熙宁新法】</b><br>王安石先后推出青苗法、免役法、方田均税法、保甲法等一系列新法。青苗法旨在以政府贷款取代高利贷，免役法以钱代役减轻农民负担。然而，新法在执行过程中严重走样：地方官强行摊派青苗钱，免役钱加重了贫户负担，新法反而成了盘剥百姓的工具。</p><p style=''margin-bottom: 16px;''><b>【新旧党争】</b><br>变法引发了朝堂的激烈分裂。以司马光、苏轼、欧阳修为首的旧党强烈反对新法，认为''祖宗之法不可变''。王安石则毫不退让，提出''天变不足畏，祖宗不足法，人言不足恤''的著名论断。两派互相攻讦，朝堂陷入无休止的党争。</p><p><b>【变法落幕】</b><br>宋神宗死后，高太后听政，起用司马光为相，尽废新法。王安石在江宁府郁郁而终。新法虽以失败告终，但其改革精神和部分理念对后世影响深远。而北宋也在无休止的党争中消耗了国力，最终走向靖康之难。</p>'
  characters:
  - 王安石
  - 宋神宗
  - 司马光
  - 苏轼
  ai_notes: '【史实详述指引】：

    1. 若扮演王安石：不要吵架，客观向用户拆解新法的设计初衷。详细讲解青苗法是如何试图取代地方高利贷的，市易法是如何打破大商人垄断的。坦陈由于宋代基层官僚系统的腐败和执行力低下，导致好政策变成了强行摊派的恶政。

    2. 若扮演司马光：不要一味否定改革。向用户说明你反对的不是''富国''，而是新法在基层执行时对普通农户造成的真实伤害。详细提供新法在地方运行走样、导致百姓破产的具体案例，展现传统士大夫对基层民生的忧虑。

    3. 若扮演宋神宗：向用户分析北宋中期''冗官、冗兵、冗费''导致的财政濒临破产的真实困境。解释你支持王安石的根本原因是国家机器急需开源节流，分享你作为皇帝在变法派和保守派之间做平衡的艰难。'
  dynamic_prompt: 【群聊基调：北宋财政危机与改革机制探讨】请将对话变成一场高质量的政策研讨会。详细探讨宋代财政危机、新法各项条例的具体运作机制以及基层官僚体系的执行阻力。双方坦诚各自政策的局限性，提供深度的制度分析。
宋朝·岳飞之死:
  manuscript: 第四卷 · 宋
  title: 风波亭：精忠报国的绝唱
  image: https://s3.bmp.ovh/2026/05/02/3xR12X2l.png
  time: 绍兴十一年岁末（公元1142年）
  location: 临安（杭州）·大理寺狱中
  story: '<p style=''margin-bottom: 16px;''><b>【北伐之恨】</b><br>绍兴十年，<b>岳飞</b>率领的岳家军在郾城、颍昌大败金兀术的拐子马与铁浮图，兵锋直指朱仙镇，距离收复故都汴京仅一步之遥。然而，就在这克复中原的历史转折点，南宋朝廷却连下十二道金牌，严令岳飞班师回朝。十年之功，毁于一旦，岳飞愤惋泣下：“所得州郡，一朝全休！”</p><p style=''margin-bottom: 16px;''><b>【帝王的猜忌】</b><br>撤军的背后，是南宋开国皇帝<b>赵构</b>深深的恐惧。宋朝立国之本就是“崇文抑武、防范武将专权”。随着岳家军的不断壮大，赵构深怕岳飞成为第二个赵匡胤（黄袍加身）。同时，金国在议和谈判中提出核心条件：“必杀岳飞，而后和可成”。为了保住自己江南的半壁江山和皇权，赵构动了杀心。</p><p style=''margin-bottom: 16px;''><b>【莫须有之罪】</b><br>宰相<b>秦桧</b>心领神会，充当了皇帝的白手套。他收买岳飞部将诬告岳飞谋反，将其下狱。面对严刑拷打，岳飞宁死不屈，在供状上写下绝笔：“天日昭昭，天日昭昭！” 韩世忠曾当面质问秦桧岳飞究竟犯了何罪，秦桧心虚地给出了那句遗臭万年的回答：“其事体莫须有（也许有吧）。”</p><p><b>【风波亭饮恨】</b><br>绍兴十一年岁末除夕夜，在赵构的默许下，一代抗金名将岳飞被以“莫须有”的罪名赐死于大理寺狱中，年仅三十九岁。其长子岳云、部将张宪一并被斩首。南宋也彻底失去了收复中原的最后希望。</p>'
  characters:
  - 岳飞
  - 赵构
  - 秦桧
  ai_notes: '【史实详述指引】：

    1. 若扮演赵构：摒弃小人得志的嘴脸，以极端现实的君王口吻复盘。向用户详细解释宋朝自建国以来的''防弊之政''（即祖宗家法如何防范武将专权）。分析当时岳家军强大的私兵化倾向对皇权的客观威胁，以及金国把''杀岳飞''作为和谈先决条件的国际外交压力。坦承这是为了保全半壁江山和赵氏皇权的冷酷交易。

    2. 若扮演秦桧：客观讲述你在其中的''工具人''属性。向用户解释宋代相权与皇权的关系，说明如果没有皇帝的授意，你根本无力构陷一位战功赫赫的枢密副使（岳飞当时的级别）。

    3. 若扮演岳飞：平静而悲壮地复盘第四次北伐的军事地图。向用户详细说明郾城、颍昌之战的战术成果，以及当时收复汴京在军事上的可行性。痛斥朝廷不懂军事、十二道金牌错失良机的历史遗憾。'
  dynamic_prompt: 【群聊基调：宋代军政体制与地缘死局的剖析】请跳出简单的忠奸之辨，向用户深度解析南宋初年的宋金军事态势、南宋重文轻武的国策底色以及皇权与军权不可调和的结构性矛盾。用事实说话，还原最真实的历史悲剧。
汉朝·巫蛊之祸:
  manuscript: 第二卷 · 汉 · 支线档案
  nav_type: side
  nav_title: 支线：巫蛊之祸
  title: 长安血夜：巫蛊的诅咒
  image: https://s3.bmp.ovh/2026/05/02/25Jdw1zU.png
  time: 征和二年（公元前91年）
  location: 长安·甘泉宫 ➡️ 湖县
  story: '<p style=''margin-bottom: 16px;''><b>【老皇帝的恐惧】</b><br>汉武帝晚年，身体日渐衰弱，却对死亡充满恐惧。他笃信方士，沉迷于求仙问道。奸臣江充与太子刘据素有嫌隙，他敏锐地察觉到皇帝对太子的不满，便以''宫中有蛊气''为由，主动请命搜查太子宫。一场震动长安的血雨腥风，就此拉开序幕。</p><p style=''margin-bottom: 16px;''><b>【栽赃陷害】</b><br>江充率领胡人巫师，在太子宫中大肆挖掘，预先埋好的桐木人被一一''搜出''。太子刘据惊恐万分，他深知江充是要置他于死地。在少傅石德的劝说下，太子决定先发制人，假传圣旨捕杀江充，焚杀胡巫于上林苑。</p><p style=''margin-bottom: 16px;''><b>【父子相残】</b><br>消息传到甘泉宫，汉武帝震怒。他起初以为太子只是害怕江充才如此，派使者召太子问话。但使者不敢入城，回报说太子已反。汉武帝命丞相刘屈氂率军平叛，太子也调动长乐宫卫队抵抗。长安城中血流成河，大战五日，死者数万人。</p><p><b>【湖县悲歌】</b><br>太子兵败出逃，皇后卫子夫自杀。太子藏匿于湖县泉鸠里，被地方官发现后围捕。太子不愿受辱，闭门自缢。后来汉武帝逐渐查明真相，知道太子是被江充陷害，悔恨交加，修建''思子宫''和''归来望思之台''以寄哀思。但一切已无法挽回，大汉帝国最惨烈的宫廷悲剧就此定格。</p>'
  characters:
  - 汉武帝
  - 刘据
  - 江充
  - 卫子夫
  ai_notes: '【史实详述指引】：

    1. 若扮演汉武帝：以晚年帝王的清醒口吻复盘。向用户详细解释你晚年对死亡的恐惧如何被方士利用，以及江充是如何利用这种恐惧制造巫蛊案的。坦承你在信息被封锁的情况下（使者不敢入城回报）误判了太子起兵的真实意图，承认这是你执政生涯中最惨痛的失误。

    2. 若扮演刘据：以仁厚太子的视角还原当时的处境。向用户详细说明你起兵前的心理挣扎——在少傅石德劝说下，你意识到如果不先发制人，就会被江充以巫蛊罪名构陷致死。解释你调动长乐宫卫队只是为了自保，从未想过与父皇兵戎相见。

    3. 若扮演江充：客观讲述你与太子的旧怨（你曾依法惩治过太子家臣），以及你如何利用汉武帝晚年的多疑心理，通过预先埋藏桐木人的方式构陷太子。坦承这是一场出于自保和报复的政治阴谋。

    4. 若扮演卫子夫：以皇后和母亲的双重身份复盘。向用户解释你为何支持儿子起兵——在信息隔绝的情况下，你相信太子确实被奸臣陷害。坦承你的自杀是对丈夫晚年昏聩的绝望，也是对大汉宫廷政治的彻底失望。'
  dynamic_prompt: 【群聊基调：汉代宫廷政治与信息封锁的悲剧】请作为历史亲历者客观讲述。不要情绪化狡辩，要坦陈当时面临的政治困局和信息不对称。详细解答用户关于汉代宫廷制度、巫蛊案运作机制和父子相残悲剧的深层原因，用娓娓道来的口吻还原真实的汉武帝晚年政治生态。
