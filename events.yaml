  time: 大业元年（公元605年）起
  location: 洛阳 ➡️ 江都/涿郡
  story: '<p style=''margin-bottom: 16px;''><b>【营建东都】</b><br><b>隋炀帝杨广</b>即位后，认为关中大兴城过于偏西，难以有效控制和转运江东的物资。他命天才建筑学家<b>宇文恺</b>营建洛阳为东都。为了彰显帝国威仪，东都洛阳修建得极其宏伟奢华，耗费了无数民脂民膏。</p><p style=''margin-bottom: 16px;''><b>【龙骨水脉】</b><br>为了彻底沟通南北交通、加强对江南的控制以及满足自己巡幸江都的欲望，杨广下令开凿贯通南北的大运河。工程分段进行，以洛阳为中心，向南开凿通济渠、邗沟直达江南，向北开凿永济渠直通涿郡（今北京）。大运河将海河、黄河、淮河、长江、钱塘江五大水系连为一体。</p><p style=''margin-bottom: 16px;''><b>【罪在当代】</b><br>这是古代世界最伟大的水利工程，却也是百姓的噩梦。杨广急功近利，征发了数以百万计的民夫投入修河。监工严酷，死者相枕。男性劳动力不足，甚至强迫妇女上阵拉纤。伴随着运河修筑的，是杨广乘坐造价昂贵的龙舟，带领庞大舰队巡游江都的极度骄奢淫逸。</p><p><b>【功在千秋】</b><br>大运河的修筑，榨干了隋朝的国力，成为激起隋末农民大起义的直接导火索之一。然而，这条运河却如同一条强韧的血管，将中国南北方的经济与政治命脉彻底融合，为后世唐宋帝国五百年的繁华奠定了不可替代的地缘基础。</p>'
  characters:
