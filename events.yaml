晋朝·八王之乱:
  manuscript: M A N U S C R I P T · J I N
  title: 皇权的自噬：司马氏的骨肉相残
  time: 元康元年至光熙元年（公元291-306年）
  location: 洛阳 ➡️ 长安
  story: '<p style=''margin-bottom: 16px;''><b>【白痴皇帝】</b><br>西晋开国皇帝司马炎驾崩后，传位给智力低下的晋惠帝<b>司马衷</b>。面对天下灾荒、百姓饿死，这位皇帝竟发出了那句千古名言：“何不食肉糜？”皇权的孱弱，瞬间打破了朝堂的权力平衡，司马氏诸王对最高权力的渴望如恶兽般被释放出来。</p><p style=''margin-bottom: 16px;''><b>【毒后专权】</b><br>丑陋且极具政治野心的皇后<b>贾南风</b>为了干预朝政，秘密联络楚王司马玮带兵进京，诛杀了辅政的外戚杨骏。此举如同打开了潘多拉魔盒，藩王带兵干政的先例一开，中央的绝对权威便荡然无存。随后，贾后又接连废杀太子，彻底激怒了宗室诸王。</p><p style=''margin-bottom: 16px;''><b>【诸王大混战】</b><br>赵王<b>司马伦</b>借口为太子报仇，发动政变诛杀贾南风，甚至一度篡位称帝。此后，齐王、成都王、河间王、东海王等相继卷入这场血腥的权力绞肉机。洛阳城几度易手，皇帝司马衷如同牵线木偶般被诸王抢来抢去，甚至在乱军中面部中箭，随从嵇绍用鲜血染红了皇帝的衣服。</p><p><b>【神州陆沉】</b><br>历时十六年的八王之乱，彻底耗尽了西晋的国力。为了在内战中获胜，诸王不惜引胡人雇佣军进入中原参战。匈奴、鲜卑等游牧民族武装趁机崛起，最终引发了“五胡乱华”的旷世惨剧，北方汉人迎来了历史上最黑暗的时代。</p>'
  characters:
