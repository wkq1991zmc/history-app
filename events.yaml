汉朝·董卓入京:
  manuscript: 第二卷 · 汉
  title: 董卓入京：中央权威塌陷
  image: https://s3.bmp.ovh/2026/05/02/b0OMZT2v.png
  time: 中平六年（公元189年）
  location: 洛阳、长安
  story: >-
    <p style='margin-bottom: 16px;'><b>【宫廷火并】</b><br>汉灵帝死后，外戚何进与宦官集团矛盾激化。何进召外兵入京，想借地方军力清除宦官，却在宫中被宦官杀害。随后袁绍等人入宫诛宦，洛阳陷入混乱。中央内部已经无法靠正常秩序解决权力冲突。</p>
    <p style='margin-bottom: 16px;'><b>【边将进城】</b><br>董卓率西凉军进入洛阳，控制朝廷。这里的关键不是“董卓突然作乱”这么简单，而是地方军队第一次如此直接地压到皇帝和百官头上。东汉中央从天下共主，变成了被军队挟持的政治中心。</p>
    <p style='margin-bottom: 16px;'><b>【废立皇帝】</b><br>董卓废少帝，立刘协为帝，是为汉献帝。废立皇帝本该是王朝最危险的政治动作，董卓却凭军力强行完成。随后他纵兵扰民，又迁都长安、焚毁洛阳，使汉室威望遭到毁灭性打击。</p>
    <p style='margin-bottom: 16px;'><b>【诸侯讨董】</b><br>袁绍、曹操、孙坚等关东州郡势力以讨董为名起兵。表面上大家仍尊奉汉室，实际上各地军政资源已经掌握在地方强人手中。讨董联军本身就说明，中央已经不能命令地方，只能被地方以“勤王”的名义重新定义。</p>
    <p><b>【群雄割据】</b><br>董卓入京的关键不只是董卓残暴，而是它宣告中央权威已经失去保护自己的能力。此后汉献帝虽然还在，天下却进入群雄割据的三国前夜。</p>
  next_event: 汉朝·汉献帝禅让
  next_note: 董卓之后，汉室成为各方势力争夺的政治符号。直到曹魏建立，汉朝才在名义上正式结束。
  characters:
  - 董卓
  - 汉献帝
  - 何进
  - 袁绍
  source_notes:
  - 主要依据《后汉书·董卓列传》《三国志·魏书·武帝纪》。
  - 讲董卓入京时应说明外戚宦官冲突和地方军队入京的制度性后果，不宜只讲董卓个人残暴。
  ai_notes: '【史实详述指引】：请把董卓入京讲成中央无法控制地方武力的标志。回答时说明何进召外兵、宦官被诛、董卓废立和关东联军之间的因果。'
  dynamic_prompt: 【群聊基调：中央权威崩塌】请帮助用户理解董卓不是凭空出现的乱臣，而是东汉长期结构失灵后进入中央的地方武力。

汉朝·汉献帝禅让:
  manuscript: 第二卷 · 汉
  title: 汉献帝禅让：四百年汉室落幕
  image: https://s3.bmp.ovh/2026/05/02/FhmUeY27.png
  time: 延康元年、黄初元年（公元220年）
  location: 许昌、洛阳
  story: >-
    <p style='margin-bottom: 16px;'><b>【被挟持的皇帝】</b><br>董卓之后，汉献帝长期辗转于军阀之间，先后受李傕、郭汜等人控制，后来被曹操迎到许都。皇帝仍是汉室合法性的最高符号，但已经没有独立掌握天下的能力。他的存在，更像各方争夺政治名义的核心。</p>
    <p style='margin-bottom: 16px;'><b>【许都岁月】</b><br>曹操以汉室名义号令天下，实际上掌握军政大权。对曹操来说，迎奉天子可以让自己的征伐拥有“奉诏”的名义；对汉献帝来说，这至少比漂泊乱军之间更能维持最低限度的安全。汉室没有立刻灭亡，却已经成为强臣政治的一部分。</p>
    <p style='margin-bottom: 16px;'><b>【魏王代汉】</b><br>曹操去世后，曹丕继承魏王和丞相地位。公元220年，汉献帝禅让，曹丕称帝，建立曹魏。禅让仪式给王朝更替披上合法外衣，但天下人都知道，汉室早已在长期割据和强臣控制中被耗空。</p>
    <p style='margin-bottom: 16px;'><b>【汉朝结束】</b><br>从刘邦称帝到汉献帝禅让，汉朝名义延续四百余年。它建立了大一统帝国的许多基本范式，也留下外戚、宦官、豪强、地方军事化和强臣代政的深刻教训。汉朝不是一夜之间崩塌，而是在长期结构裂缝中慢慢失去实际控制力。</p>
    <p><b>【进入魏晋】</b><br>汉献帝禅让不是故事的突然结尾，而是三国格局正式制度化的开端。此后曹魏、蜀汉、孙吴并立，中国历史进入魏晋南北朝前的长期分裂与重组。</p>
  next_event: 汉朝·汉朝骨架
  next_note: 汉朝正式落幕。回到骨架页，可以从二十个节点重新看两汉如何兴起、强盛、断裂、重建并最终走向三国。
  characters:
  - 汉献帝
  - 曹丕
  - 曹操
  source_notes:
  - 主要依据《后汉书·献帝纪》《三国志·魏书·文帝纪》。
  - 禅让是王朝更替的政治仪式，不应简单理解为汉献帝主动、自愿地让出天下。
  ai_notes: '【史实详述指引】：请把汉献帝禅让讲成汉朝名义终结与曹魏合法性建立。回答时说明献帝被挟持、曹操奉天子、曹丕代汉和三国制度化之间的关系。'
  dynamic_prompt: 【群聊基调：汉室落幕与三国开场】请帮助用户理解汉朝不是在公元220年突然死亡，而是在黄巾、董卓、军阀割据中逐步失去实际统治。

