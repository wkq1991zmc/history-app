五代·陈桥兵变:
  manuscript: 第六卷 · 五代十三国
  title: 黄袍加身：兵不血刃的篡位
  image: https://s3.bmp.ovh/2026/05/02/23zixxLe.png
  time: 建隆元年（公元960年）
  location: 陈桥驿（今河南封丘） ➡️ 开封
  story: '<p style=''margin-bottom: 16px;''><b>【主少国疑】</b><br>后周显德七年，周世宗柴荣英年早逝，年仅七岁的柴宗训继位。主少国疑，朝野不安。殿前都点检<b>赵匡胤</b>手握禁军大权，威望日隆。此时，北方传来北汉与辽国联军南下的消息，宰相范质未加详查，急令赵匡胤率军北上御敌。</p><p style=''margin-bottom: 16px;''><b>【陈桥驿变】</b><br>大军行至陈桥驿驻扎。当夜，赵匡胤之弟赵匡义与谋士赵普在军中散布''今主上幼弱，我辈出死力破敌，谁知当立谁''的言论，煽动军心。次日黎明，诸将手持兵器闯入赵匡胤寝帐，将一件黄袍披在他身上，高呼万岁，拥立为帝。</p><p style=''margin-bottom: 16px;''><b>【兵不血刃】</b><br>赵匡胤率军返回开封，守将石守信、王审琦早已暗中配合，大开城门。赵匡胤入城后，对后周皇室和朝臣秋毫无犯，仅以''禅让''之名登基，改国号为宋。这场政变几乎兵不血刃，开创了中国历史上最和平的王朝更替。</p><p><b>【杯酒释兵权】</b><br>登基后，赵匡胤深知武将专权的危害。他设宴款待石守信等开国功臣，以高官厚禄换取他们交出兵权。''人生如白驹过隙，不如多积金帛田宅以遗子孙，歌儿舞女以终天年。'' 从此宋朝确立了''重文轻武''的国策，影响深远。</p>'
  characters:
  - 赵匡胤
  - 赵普
  - 石守信
  - 范质
  ai_notes: '【史实详述指引】：

    1. 若扮演赵匡胤：以开国君王的坦率口吻复盘。向用户详细解释陈桥兵变的策划过程——''黄袍加身''并非被动接受，而是你与赵普、赵匡义等人精心策划的政治行动。说明你为何选择以和平方式完成政权更替（避免五代以来频繁战乱），以及你对后周皇室宽厚处理的真实考量：树立新政权的合法性与仁德形象。

    2. 若扮演赵普：以谋士的理智口吻回答。向用户详细说明你在兵变中的具体作用：如何煽动军心、如何策划''黄袍加身''的仪式、如何确保回师开封时石守信等内应配合。解释你为何认为这是结束五代乱世、建立稳定政权的最佳时机。

    3. 若扮演石守信：以武将的直率口吻复盘。向用户解释你参与兵变的真实动机——既有对赵匡胤的个人忠诚，也有对后周幼主政权不稳定性的担忧。详细说明你作为内应打开城门的具体操作，以及你在宋朝建立后主动交出兵权的考量。

    4. 若扮演范质：以后周老臣的沉重口吻回答。向用户解释你未加详查就派赵匡胤出征的失误——当时北汉与辽国联军南下的情报看似紧急，但事后证明是虚假军情。坦承你在政权更替中的无奈选择：面对既成事实，抵抗只会带来更多流血。'
  dynamic_prompt: 【群聊基调：五代政权更迭与宋代建立的制度转型】请作为历史亲历者客观讲述。不要情绪化狡辩，要坦陈当时面临的政治困局。详细解答用户关于五代军事制度、陈桥兵变的策划细节、以及宋朝'重文轻武'国策的形成原因，用娓娓道来的口吻还原真实的五代末宋初政治生态。
五代·儿皇帝石敬瑭:
  manuscript: 第六卷 · 五代十三国
  title: 燕云十六州：屈辱的割让
  image: https://s3.bmp.ovh/2026/05/02/XRfVFBTi.png
  time: 天显十一年（公元936年）
  location: 太原 ➡️ 洛阳
  story: '<p style=''margin-bottom: 16px;''><b>【君臣猜忌】</b><br>后唐清泰三年，河东节度使<b>石敬瑭</b>镇守太原，手握重兵。后唐末帝李从珂对他极度猜忌，屡次试图削夺其兵权。石敬瑭深知自己处境危险，暗中积蓄力量，准备反叛。但他兵力不足，难以与朝廷抗衡，于是将目光投向了北方的契丹。</p><p style=''margin-bottom: 16px;''><b>【割地求援】</b><br>石敬瑭派使者向契丹主耶律德光求援，开出了令人震惊的条件：割让<b>燕云十六州</b>给契丹，并尊耶律德光为''父皇帝''，自称''儿皇帝''。燕云十六州是中原王朝北方的天然屏障，失去此地，中原门户大开，无险可守。</p><p style=''margin-bottom: 16px;''><b>【契丹南下】</b><br>耶律德光大喜，亲率五万骑兵南下支援石敬瑭。在契丹铁骑的帮助下，石敬瑭大败后唐军队，攻入洛阳，建立后晋。石敬瑭如约割让燕云十六州，每年向契丹进贡帛三十万匹。中原王朝从此失去了抵御北方游牧民族的战略屏障。</p><p><b>【遗祸百年】</b><br>石敬瑭的割地行为遗祸深远。燕云十六州的丢失，使得后来的北宋始终面临北方威胁，不得不维持庞大军队，财政负担沉重。直到明朝洪武年间，徐达北伐才收复此地。石敬瑭也因此成为中国历史上最著名的卖国贼之一，遗臭万年。</p>'
  characters:
  - 石敬瑭
  - 耶律德光
  - 李从珂
  ai_notes: '【史实最高红线】：

    1. 若扮演石敬瑭：你割让燕云十六州是出于政治自保的需要，你并非不知道此举的后果，但在权力与民族利益之间，你选择了前者。你要表现出政治家的冷酷与内心的矛盾。

