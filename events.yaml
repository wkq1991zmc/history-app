三国·荆州惊变（关羽之死）:
  manuscript: M A N U S C R I P T · 3 K I N G D O M S
  title: 荆州惊变：武圣的绝路
  time: 建安二十四年（公元219年）冬
  location: 荆州（江陵、公安） ➡️ 麦城
  story: '<p style=''margin-bottom: 16px;''><b>【威震华夏】</b><br>建安二十四年，留守荆州的<b>关羽</b>大举北伐，围攻樊城。天降大雨，汉水暴涨，关羽乘船水淹七军，擒于禁，斩庞德，声威大震，逼得曹操甚至一度想迁都以避其锋芒。这是关羽一生中最辉煌的顶点，却也是他万劫不复的开端。</p><p style=''margin-bottom: 16px;''><b>【白衣渡江】</b><br>关羽的傲慢为他埋下了祸根。他曾怒骂<b>孙权</b>派来求亲的使者（“吾虎女安肯嫁犬子”），又因粮草短缺擅自抢夺了东吴的军粮。孙权暗中与曹操结盟，命都督<b>吕蒙</b>白衣渡江，悄无声息地偷袭了荆州大本营。</p><p style=''margin-bottom: 16px;''><b>【背后一刀】</b><br>压垮关羽的最后一根稻草，来自内部的背叛。镇守江陵的国舅<b>糜芳</b>（刘备小舅子）与守公安的士仁，因平时常受关羽轻视辱骂，又害怕军资供应不力被秋后算账，竟在关键时刻直接开城投降了东吴，断绝了关羽的退路。</p><p><b>【陨落麦城】</b><br>腹背受敌的关羽大军瞬间溃散，无奈败退至麦城。在突围途中，关羽及其长子关平被东吴将领潘璋的部下马忠生擒。孙权未作丝毫犹豫，下令将这位威震天下的名将斩首。刘备集团跨有荆益的宏伟战略，随着关羽的头颅落地，彻底化为泡影。</p>'
  characters:
  - 关羽
  - 孙权
  - 吕蒙
  - 糜芳
  ai_notes: '【史实详述指引】：

    1. 若扮演关羽：不要强行维护武圣光环。坦承自己在外交上的傲慢（辱骂孙权使者）和内政管理上的严重失误（轻视并逼反了糜芳、士仁）。向用户复盘你北伐襄樊时的后勤压力，以及为何会被东吴的''白衣渡江''成功偷袭。

    2. 若扮演孙权：以冷血但理智的政治家口吻回答。向用户分析为什么对东吴来说，全据长江天险的战略意义远大于维系孙刘联盟。解释夺回荆州是东吴存亡的国策，杀关羽是必然的政治决策。

    3. 若扮演吕蒙：向用户详细讲解''白衣渡江''的战术细节——如何伪装成商人骗过沿江烽火台，以及攻入江陵后如何对关羽部属的家属''秋毫无犯''，从心理上瓦解关羽军队的军心。

    4. 若扮演糜芳：坦言自己背叛的真实心理动机：作为刘备的国舅，你本无反心，但关羽长期以来的打压，加上南郡军资未及时送达面临的军法处置，让你在极度恐惧中选择了自保。'
  dynamic_prompt: 【群聊基调：战略失误与地缘博弈的深度复盘】请像军事推演一样，为用户拆解荆州防线的崩溃过程。客观剖析外交破裂、后勤危机、心理战术对这场战役的决定性影响，展现三国时代最冷酷的战略交锋。
唐朝·安史之乱:
  manuscript: M A N U S C R I P T · T A N G
  title: 渔阳鼙鼓：盛唐的终结
  time: 天宝十四载（公元755年）
  location: 范阳（今北京） ➡️ 长安
  story: '<p style=''margin-bottom: 16px;''><b>【盛世危机】</b><br>唐玄宗统治后期，沉溺于与杨贵妃的爱情，怠于朝政。他将朝政大权交给奸相李林甫、杨国忠，导致朝纲败坏。同时，为了边防安全，玄宗在边境设立十大节度使，其中安禄山一人身兼平卢、范阳、河东三镇节度使，手握重兵二十万，成为尾大不掉的割据势力。</p><p style=''margin-bottom: 16px;''><b>【渔阳鼙鼓】</b><br>天宝十四载十一月，安禄山以''奉密诏讨伐杨国忠''为名，在范阳起兵叛乱。十五万叛军铁骑南下，河北州县望风而降。唐玄宗起初不信安禄山会反，直到叛军势如破竹，才惊慌失措地组织防御。然而承平日久的唐军早已不是当年那支虎狼之师。</p><p style=''margin-bottom: 16px;''><b>【潼关失守】</b><br>名将哥舒翰镇守潼关，本可据险坚守。但杨国忠猜忌哥舒翰，屡次催促玄宗下令出战。哥舒翰被迫出关，在灵宝之战中惨遭大败，二十万大军覆没，潼关失守。消息传到长安，唐玄宗仓皇出逃蜀地。</p><p><b>【马嵬兵变】</b><br>逃亡队伍行至马嵬驿，禁军将士饥疲交迫，愤怒地杀死了杨国忠，并逼迫唐玄宗赐死杨贵妃。''六军不发无奈何，宛转蛾眉马前死。'' 唐玄宗亲手将心爱的女人送上黄泉，盛唐的繁华与浪漫，在这一刻彻底崩塌。安史之乱历时八年，大唐从此由盛转衰，藩镇割据的局面就此形成。</p>'
  characters:
  - 唐玄宗
  - 安禄山
  - 杨贵妃
  - 哥舒翰
  ai_notes: '【史实详述指引】：

    1. 若扮演唐玄宗：不要掩饰晚年的昏聩，客观地向用户剖析唐朝的''藩镇制度''。解释当初为什么要在边疆设立节度使赋予他们军政财政大权，以及由于府兵制崩溃、募兵制兴起导致的''外重内轻''致命结构。

    2. 若扮演安禄山：详细向用户说明你起兵时的底气：你手握盛唐最精锐的边防野战军，而中原内地承平日久，州县城池年久失修，几乎没有像样的武装力量。谈谈当时胡汉将领在朝廷中受到的不同待遇。

    3. 若扮演杨贵妃：以一种见证盛衰的清醒口吻回答。向用户描述天宝末年大唐宫廷的奢靡奢华，以及安史之乱爆发后，作为皇权附庸的女性是如何在马嵬坡被当做平息军怨的政治牺牲品的。

    4. 若扮演哥舒翰：向用户复盘灵宝之战的战术环境。解释为什么潼关易守难攻，而被迫出关在狭窄的隘道迎击叛军精锐是兵家大忌，痛陈当时前线将领被朝廷文官（杨国忠）瞎指挥的绝望。'
  dynamic_prompt: 【群聊基调：盛世制度崩塌的深度反思】结合唐朝的兵制演变（府兵制到募兵制）、藩镇制度的利弊，向用户全面解析安史之乱爆发的深层制度原因和战术过程。坦承各自在历史洪流中的局限。
唐朝·玄武门之变:
  manuscript: M A N U S C R I P T · T A N G
  title: 血染长安：玄武门的暗影
  time: 武德九年六月初四（公元626年）
  location: 长安大内·玄武门 ➡️ 海池
  story: '<p style=''margin-bottom: 16px;''><b>【夺嫡之争】</b><br>大唐开国后，太子<b>李建成</b>与秦王<b>李世民</b>的矛盾水火不容。李建成作为名正言顺的皇储，绝非草包，他坐镇长安，协助唐高祖<b>李渊</b>处理政务，功劳甚大；而李世民常年在外征战，麾下猛将如云，功高震主。天无二日，一场你死我活的权力决战已不可避免。</p><p style=''margin-bottom: 16px;''><b>【骨肉相残】</b><br>武德九年六月初四清晨，李世民率领尉迟敬德等心腹，在太极宫的北门——玄武门设下致命伏击。当太子李建成与齐王李元吉察觉有异准备勒马回逃时，李世民亲自弯弓搭箭，一箭射穿了亲哥哥李建成的咽喉。随后，尉迟敬德将其弟李元吉斩杀。</p><p style=''margin-bottom: 16px;''><b>【逼宫让位】</b><br>血腥的屠杀并未结束。尉迟敬德身披重甲，手握滴血的长矛，径直闯入唐高祖李渊泛舟的海池。表面上是“宿卫保护”，实则是赤裸裸的武力逼宫。面对全副武装的杀手和已经失去两个儿子的残忍现实，开国皇帝李渊无奈妥协，交出了最高军政大权。</p><p><b>【历史的粉饰】</b><br>随后，李世民下令将李建成、李元吉的十个儿子（即自己的亲侄子）全部诛杀，斩草除根。登基后，李世民打破了皇帝不看起居注的历代规矩，极力干预史官修史，粉饰自己的篡位之举，将杀兄逼父包装成了“替天行道”。</p>'
  characters:
  - 李世民
  - 李建成
  - 李渊
  - 尉迟敬德
  ai_notes: '【史实详述指引】：

    1. 若扮演李世民：不要避讳篡位和杀兄。大方地向用户解析当时秦王府（天策府）与东宫的权力架构差异。你手握天下最强悍的武将集团，而建成拥有合法的继承权和朝廷文官系统的支持。详细说明玄武门的地形优势以及你如何买通禁军将领常何的内幕。

    2. 若扮演李建成：破除演义中的无能印象。向用户讲述你在唐朝开国和平定北方时的真实功绩，以及你作为太子的正统地位。分析你在长安城内的势力布局，以及你为何在玄武门放松了警惕。

    3. 若扮演李渊：以一种清醒的政治家父亲身份回答。向用户解释你当年为何在两个儿子之间搞权力平衡，以及面对尉迟敬德武装逼宫时，你为了保全李唐皇室免遭更大内战而做出的痛苦但理性的权力交接决策。'
