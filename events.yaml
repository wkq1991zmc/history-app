汉朝·长乐宫血案:
  manuscript: M A N U S C R I P T · H A N
  title: 鸟尽弓藏：兵仙的黄昏
  time: 汉高祖十一年（公元前196年）
  location: 长安·长乐宫钟室
  story: '<p style=''margin-bottom: 16px;''><b>【裂土封王】</b><br>楚汉相争时，<b>韩信</b>统帅大军连灭魏、赵、代、燕、齐五国，被刘邦封为齐王，后改封楚王。功高无二，略不世出。但在垓下之战前，韩信曾拥兵不发，逼迫<b>刘邦</b>封他为“假齐王”，这颗猜忌的种子在那时便已深深种下。</p><p style=''margin-bottom: 16px;''><b>【猛虎拔牙】</b><br>天下初定，刘邦立刻采用陈平的计策，伪游云梦，在陈县将韩信突袭抓捕，贬为淮阴侯。昔日叱咤风云的兵仙，如今只能被软禁在长安，与周勃、樊哙等他曾经看不起的将领同列，韩信常常称病不朝，日夜怨恨。</p><p style=''margin-bottom: 16px;''><b>【长乐钟声】</b><br>汉高祖十一年，陈豨在外叛乱，刘邦亲自率军平叛。留在长安的<b>吕后</b>接到密告，称韩信准备在京城内应造反。吕后采纳相国萧何的计谋，假称刘邦已平叛班师，诱骗韩信入宫庆贺。韩信一踏入长乐宫，便被武士捆绑。</p><p><b>【成败萧何】</b><br>“吾悔不用蒯通之计，乃为儿女子所诈，岂非天哉！”这是韩信留在世间最后的遗言。吕后未等刘邦回来，便在长乐宫钟室将韩信斩杀，并夷其三族。那位曾发掘他的萧何，最终也成了送他上路的推手。千古名将，落得个兔死狗烹的结局。</p>'
  characters:
  - 韩信
  - 刘邦
  - 吕后
  - 萧何
  ai_notes: '【史实详述指引】：

    1. 若扮演韩信：以军事天才的坦率口吻复盘。向用户详细说明你在楚汉战争中的战略贡献（连灭五国），以及你在齐地拥兵要挟刘邦封''假齐王''的真实考量——你认为这是应得的报酬，而非背叛。坦承自己在政治上的短视：天下已定后仍保持军事天才的傲慢，不懂得收敛锋芒，最终导致悲剧。

    2. 若扮演刘邦：以开国君王的理智口吻回答。向用户解释你''且喜且怜之''的复杂心理——既庆幸消除了军事威胁，又惋惜故人的陨落。详细说明汉初异姓王问题的严重性，以及你为何必须逐步清除这些拥有独立军政权力的诸侯王来巩固刘氏皇权。

    3. 若扮演吕后：以政治家的冷静口吻复盘。向用户解释你杀韩信的核心动机：刘邦出征在外，你作为实际执政者必须消除京城内部的军事威胁。详细说明你与萧何合谋诱骗韩信入宫的具体操作，以及夷三族是为了彻底消除后患的政治考量。

    4. 若扮演萧何：以相国的沉重口吻回答。向用户解释你为何选择背叛韩信——在个人私交与汉朝政权稳定之间，你选择了后者。详细说明当时长安的政治形势：如果韩信真的在京城起兵响应陈豨，新生的汉朝将面临二次崩溃的危险。'
