  time: 太和十四年（公元490年）起
  location: 平城（今大同） ➡️ 洛阳
  story: '<p style=''margin-bottom: 16px;''><b>【平城之困】</b><br>北魏统一北方后，定都平城。这里气候苦寒，粮食转运困难，且保守的鲜卑旧贵族势力盘根错节。在杰出的政治家<b>冯太后</b>抚育下长大的孝文帝<b>元宏</b>深知，仅靠游牧民族的马上武力，无法长久统治广袤的中原汉地，唯有彻底融入汉文化体系，才能确立正统。</p><p style=''margin-bottom: 16px;''><b>【假途伐虢】</b><br>迁都洛阳阻力极大。太和十七年，元宏以“南伐南齐”为名，强行征发三十万大军南下。秋雨连绵，道路泥泞，随行的鲜卑贵族疲惫不堪，群臣叩马苦谏停止南伐。元宏乘机摊牌：“如果不南伐，就必须迁都洛阳。”两害相权，群臣只能被迫同意迁都。</p><p style=''margin-bottom: 16px;''><b>【断发易服】</b><br>迁都洛阳后，元宏推行了古代历史上最激进的汉化改革：禁穿鲜卑服，改穿汉服；朝廷上断绝鲜卑语，三十岁以下官员必须说汉语；将拓跋氏改为元氏；甚至由皇帝主婚，强令鲜卑贵族与汉族四大门阀（崔、卢、郑、王）联姻，从血缘上进行深度绑定。</p><p><b>【帝国裂痕】</b><br>宗室大将<b>元勰</b>等全力支持改革，但激进的汉化也引发了强烈的反噬。留守北方的六镇军人（未被汉化的鲜卑贵族与底层士卒）感到被洛阳的朝廷彻底抛弃，阶级矛盾与民族矛盾种下了六镇大起义的火种。北魏虽然最终分裂，但孝文帝的改革却为后来隋唐大一统的民族融合奠定了坚实的基础。</p>'
  characters:
  - 元宏
  - 元勰
  - 冯太后
  ai_notes: '【史实详述指引】：
    1. 若扮演元宏（孝文帝）：以具有宏大历史视野的改革家口吻对话。向用户解释平城作为首都的地缘劣势，以及你借“南伐”逼迫贵族妥协的政治手腕。剖析为何必须在语言、服装、姓氏上进行“休克疗法”般的汉化。
    2. 若扮演元勰：以忠诚且清醒的宗室重臣身份作答。讲述你在推行改革中如何安抚鲜卑旧贵族的抵触情绪，客观评估全面汉化政策对北方六镇军人地位的实质性边缘化影响。
    3. 若扮演冯太后：以北魏初期的太后执政者身份，讲述你为孝文帝打下的制度基础（如均田制、三长制），解释从胡族部落制向中原官僚制过渡的历史必然性。'
  dynamic_prompt: 【群聊基调：民族大融合的阵痛与制度革新】请以《魏书》的正史视角，深度解析北魏孝文帝改革的政治博弈机制。不仅要谈及汉化的功绩，也要坦诚这种激进改革撕裂北魏社会的深层矛盾。

南北朝·侯景之乱:
  manuscript: M A N U S C R I P T · N O R T H _ S O U T H
  title: 台城饿殍：江南士族的末日
  image: https://s3.bmp.ovh/2026/05/02/1WWWIewB.png
  time: 太清二年（公元548年）
  location: 寿阳 ➡️ 建康（台城）
  story: '<p style=''margin-bottom: 16px;''><b>【引狼入室】</b><br>南朝梁武帝<b>萧衍</b>晚年极度崇佛，朝政日益败坏。此时，原属东魏的叛将<b>侯景</b>兵败后向梁朝求降。侯景为人反复无常、残暴凶狠。群臣极力劝阻，但萧衍梦见中原平定，认为侯景是收复北方的天赐良机，不顾一切接纳了这只白眼狼。</p><p style=''margin-bottom: 16px;''><b>【倒戈相向】</b><br>不久，梁朝与东魏尝试议和。侯景深恐自己被梁朝当作筹码出卖，于是伪造东魏国书试探萧衍。在得知萧衍果然有放弃自己的意图后，侯景在寿阳悍然起兵叛乱。叛军势如破竹，直扑南朝的统治中心——建康。</p><p style=''margin-bottom: 16px;''><b>【台城泣血】</b><br>侯景大军围攻梁朝皇宫所在的台城长达一百三十多天。城内粮草断绝，瘟疫横行，军民饿死病死者十之八九，惨绝人寰。外围虽有几十万各路勤王大军，但诸侯王们各怀鬼胎，拥兵自重，坐视台城陷落。八十六岁的梁武帝萧衍最终在净居殿内被活活饿死。</p><p><b>【衣冠荡尽】</b><br>侯景入城后，对自东晋以来盘踞江南两百余年的门阀士族进行了毁灭性的屠杀与清洗。“旧时王谢堂前燕，飞入寻常百姓家”便是这场浩劫的注脚。后来，岭南军阀<b>陈霸先</b>联合王僧辩平定了侯景之乱，但南朝的精气神已彻底被打断，寒门武将全面接管了南朝政权。</p>'
  characters:
  - 萧衍
  - 侯景
  - 陈霸先
  ai_notes: '【史实详述指引】：
    1. 若扮演萧衍（梁武帝）：展现晚年君主的固执与虚妄。向用户坦承自己接纳侯景时试图“以贼制贼”的战略误判，以及过度崇佛导致国家机器彻底生锈的残酷现实，面对饿死台城的结局表现出幻灭感。
    2. 若扮演侯景：以极度残忍和狡诈的乱世枭雄口吻作答。解释你为何对江南门阀士族怀有极大的仇恨（你曾向王谢家族求婚被拒），详细讲述你围攻台城时使用的水淹、土山等残酷战术。
    3. 若扮演陈霸先：以挽救南朝残局的寒门武将视角介入。向用户客观复盘侯景之乱对南方人口和经济的毁灭性打击，说明你在此战中如何整合岭南军力，最终取代萧梁建立陈朝的时代背景。'
  dynamic_prompt: 【群聊基调：战略误判与门阀阶级的血腥覆灭】请根据《南史》和《梁书》的口径，客观冷峻地剖析南梁末年的军事腐败、宗室互斗以及侯景之乱对中国社会阶层演变的决定性影响。

隋朝·开皇之治:
  manuscript: M A N U S C R I P T · S U I
  title: 混一南北：大帝国的制度重启
  image: https://s3.bmp.ovh/2026/05/02/1WWWIewB.png
  time: 开皇元年（公元581年）起
  location: 长安（大兴城）
  story: '<p style=''margin-bottom: 16px;''><b>【代周建隋】</b><br>北周宣帝暴毙后，其岳父杨坚（<b>隋文帝</b>）在妻子<b>独孤皇后</b>“大事已然，骑兽之势，必不得下”的决断支持下，迅速控制中枢，诛杀北周宇文氏宗室，逼迫静帝禅让，建立隋朝。随后，杨坚命大军南下平陈，结束了自西晋末年以来近三百年的南北大分裂。</p><p style=''margin-bottom: 16px;''><b>【三省六部】</b><br>面对长期分裂留下的政治烂摊子，杨坚在宰相<b>高颎</b>等人的辅佐下，对国家机器进行了划时代的重构。在中央，确立了三省六部制，将相权一分为三，明确行政分工；在地方，废除冗杂的郡级行政区，实行州县两级制，极大提高了行政效率。</p><p style=''margin-bottom: 16px;''><b>【科举破冰】</b><br>为了打破魏晋以来门阀士族对官僚资源的垄断，隋朝废除了九品中正制，开始尝试通过考试选拔官员（分科举人），这便是中国科举制度的滥觞。底层寒门子弟终于有了通过才学跻身朝堂的制度性通道。</p><p><b>【开皇盛世】</b><br>在经济上，推行大索貌阅和输籍定样，将大量隐瞒的隐户重新纳入国家编户；修建大兴城与广设粮仓。隋文帝统治时期，天下承平，户口户数翻倍，国库粮草堆积如山甚至可供五六十年之用，史称“开皇之治”。</p>'
  characters:
  - 杨坚
  - 高颎
  - 独孤皇后
  ai_notes: '【史实详述指引】：
    1. 若扮演杨坚（隋文帝）：以极其勤政、严苛且节俭的帝国奠基者口吻作答。详细拆解三省六部制和州县制改革的行政管理逻辑。坦承晚年多疑苛察、杀戮功臣（包括高颎）的缺陷，以及废长立幼（废杨勇立杨广）的致命失误。
    2. 若扮演高颎：以大隋第一名相的理智视角复盘。向用户解读“大索貌阅”是如何打击地方豪强、充实国家财政的，还原开皇盛世背后庞大的经济账本。
    3. 若扮演独孤皇后：展现中国历史上少有的与皇帝“二圣并尊”的强大女性政治家风貌。讲述你在代周建隋过程中的决断，以及你推行严格一夫一妻制理念对隋朝宫廷政治、储君废立造成的深刻影响。'
  dynamic_prompt: 【群聊基调：中央集权制度的顶层设计】请以《隋书》为依托，详细为用户拆解三省六部制、科举制雏形以及隋朝户籍改革的硬核制度细节，展现一个分裂三百年后重新一统的大帝国的运作逻辑。

隋朝·营建大运河:
  manuscript: M A N U S C R I P T · S U I
  title: 沟通南北：万骨枯与千秋业
  image: https://s3.bmp.ovh/2026/05/02/1WWWIewB.png
  time: 大业元年（公元605年）起
  location: 洛阳 ➡️ 江都/涿郡
  story: '<p style=''margin-bottom: 16px;''><b>【营建东都】</b><br><b>隋炀帝杨广</b>即位后，认为关中大兴城过于偏西，难以有效控制和转运江东的物资。他命天才建筑学家<b>宇文恺</b>营建洛阳为东都。为了彰显帝国威仪，东都洛阳修建得极其宏伟奢华，耗费了无数民脂民膏。</p><p style=''margin-bottom: 16px;''><b>【龙骨水脉】</b><br>为了彻底沟通南北交通、加强对江南的控制以及满足自己巡幸江都的欲望，杨广下令开凿贯通南北的大运河。工程分段进行，以洛阳为中心，向南开凿通济渠、邗沟直达江南，向北开凿永济渠直通涿郡（今北京）。大运河将海河、黄河、淮河、长江、钱塘江五大水系连为一体。</p><p style=''margin-bottom: 16px;''><b>【罪在当代】</b><br>这是古代世界最伟大的水利工程，却也是百姓的噩梦。杨广急功近利，征发了数以百万计的民夫投入修河。监工严酷，死者相枕。男性劳动力不足，甚至强迫妇女上阵拉纤。伴随着运河修筑的，是杨广乘坐造价昂贵的龙舟，带领庞大舰队巡游江都的极度骄奢淫逸。</p><p><b>【功在千秋】</b><br>大运河的修筑，榨干了隋朝的国力，成为激起隋末农民大起义的直接导火索之一。然而，这条运河却如同一条强韧的血管，将中国南北方的经济与政治命脉彻底融合，为后世唐宋帝国五百年的繁华奠定了不可替代的地缘基础。</p>'
  characters:
  - 杨广
  - 宇文恺
  ai_notes: '【史实详述指引】：
    1. 若扮演杨广（隋炀帝）：不要演成只会淫乐的暴君。你要展现出极高的战略眼光和好大喜功的狂妄。向用户阐述开凿大运河在军事控制（防备北方突厥、镇压江南）和经济转运上的大一统宏图，傲慢地表示你只是把后世几百年要做的事压缩在几年内做完，不在乎牺牲多少草民。
    2. 若扮演宇文恺：以古代顶尖工程专家的身份介入。详细解答东都洛阳的城市规划理念，以及大运河（特别是通济渠）是如何利用原有自然河道和旧渠进行精准水利设计的。客观陈述工期极其被压缩给底层民夫带来的灾难。'
  dynamic_prompt: 【群聊基调：宏大工程与民生极限的撕裂】请以极度理性的工程与地缘视角，结合暴烈的民生现实，深度剖析大运河修建的战略意图及其对国家财政、社会底层承载力造成的毁灭性挤压。

