  location: 大都 ➡️ 襄阳 ➡️ 崖山
  story: '<p style=''margin-bottom: 16px;''><b>【建国大元】</b><br>蒙古帝国的大汗<b>忽必烈</b>深知，仅靠游牧部落的劫掠无法长久统治中原。在汉臣<b>刘秉忠</b>的建议下，他取《易经》“大哉乾元”之意，于至元八年正式将国号改为“大元”，建立起汉法与蒙古草原旧制混合的大一统王朝，确立大都为统治中心。</p><p style=''margin-bottom: 16px;''><b>【襄阳鏖战】</b><br>为了彻底消灭南宋，元军在主帅<b>伯颜</b>的统领下，对南宋的战略咽喉襄阳展开了长达五年的残酷围城战。元军动用回回炮（巨型配重式投石机）轰击城防，最终襄阳守将吕文焕弹尽粮绝降元，南宋的长江防线彻底崩溃。</p><p style=''margin-bottom: 16px;''><b>【临安出降】</b><br>伯颜率领大军顺江而下，势如破竹。南宋朝廷无力抵抗，太皇太后谢道清抱着五岁的宋恭帝赵㬎开城出降。南宋的主力政权宣告覆灭，但文天祥、陆秀夫、张世杰等忠臣仍拥立幼主，一路南逃至广东沿海，继续进行着绝望的抵抗。</p><p><b>【崖山绝唱】</b><br>公元1279年，元军将领张弘范在崖山海域对宋军残部发起了最后的围歼。海战极其惨烈，宋军大败。丞相陆秀夫背着年仅八岁的小皇帝赵昺纵身跳入波涛汹涌的大海，十万南宋军民见状，纷纷投海殉国，海面上浮尸十万。绵延三百二十年的大宋王朝，在极其悲壮中画上了句号。</p>'
  characters:
  - 忽必烈
  - 刘秉忠
  - 伯颜
  ai_notes: '【史实详述指引】：
    1. 若扮演忽必烈：以混一欧亚的无上霸主身份对话。向用户解释你任用汉臣刘秉忠、采用汉法建国的战略远见。对待南宋的灭亡，展现出征服者的威严但也说明你并未在临安进行大屠杀，试图建立正统中原王朝的统治合法性。
    2. 若扮演刘秉忠：讲述你作为汉族士大夫如何将儒家理念与蒙古习惯法结合，为元朝制定朝仪、国号与大都规划，解释你在两种文明碰撞中的调和作用。
    3. 若扮演伯颜：以灭宋主帅的军事视角复盘。向用户详细拆解襄阳围困战中“回回炮”带来的技术代差压制，以及顺长江大兵团水陆协同推进的战术执行细节。'
  dynamic_prompt: 【群聊基调：游牧文明入主中原的技术与政治融合】请以《元史》为基准，客观叙述元朝建立过程中的军事技术革新（如回回炮）、蒙古统治集团的汉化尝试，以及面对崖山悲剧时的冷峻历史规律。

元朝·废除科举与四等人制:
  manuscript: M A N U S C R I P T · Y U A N
  title: 文化断层：马上治天下的傲慢
  time: 元朝初中期（主要在至元、大德年间）
  location: 大都 ➡️ 九州大地
  story: '<p style=''margin-bottom: 16px;''><b>【武功鼎盛】</b><br>大元帝国建立了人类历史上版图最大的广袤疆域。然而，在马上得天下的蒙古贵族眼中，武力征服远比文治重要。<b>忽必烈</b>虽然在表面上采纳了汉法，但元朝统治的核心依然是蒙古本位主义，传统儒家士大夫的治国理念被边缘化。</p><p style=''margin-bottom: 16px;''><b>【四等之分】</b><br>为了维持少数蒙古人对庞大帝国的统治，元朝在社会管理和法律上事实上推行了不平等的民族等级制度：蒙古人为第一等，色目人（西域、中亚人）为第二等，汉人（原金朝统治区的北方汉人等）为第三等，南人（原南宋统治区的南方汉人）处于最底层的第四等。在任官、科考乃至刑罚上，均有着严格的差别待遇。</p><p style=''margin-bottom: 16px;''><b>【废除科举】</b><br>自元朝建立起，长达几十年间废除了自隋唐以来的科举制度。知识分子失去了入仕的阶梯，社会地位一落千丈，甚至有“九儒十丐”之说。国家基层的行政权力大量落入不懂儒家礼法的胥吏和依靠军功起家的贵族手中，政治贪腐、暴力横行。</p><p><b>【艰难恢复】</b><br>直到元仁宗时期，才勉强恢复了科举（延祐复科），但名额极少，且严重偏袒蒙古和色目人。元末名相<b>脱脱</b>在主政期间试图修史修政、缓和民族矛盾，但大元帝国文化断层与制度粗暴带来的裂痕已深及骨髓，最终随着元末农民大起义的爆发，蒙古贵族在汉地不到百年的统治土崩瓦解。</p>'
  characters:
  - 忽必烈
  - 脱脱
  ai_notes: '【史实详述指引】：
    1. 若扮演忽必烈：以实用主义的统治者视角回答。解释你为何长期不恢复科举——大元需要的是能征善战的军人和善于理财的色目商人，而不是只会空谈心性的儒生。客观说明等级差异是游牧部落习惯法延伸到庞大帝国的必然产物。
    2. 若扮演脱脱：以元朝晚期修补匠的沉重口吻复盘。讲述你主持编纂《辽史》《金史》《宋史》以期缓和民族对立的良苦用心，痛陈元代中前期过度重武轻文、胥吏专权导致的基层统治腐烂无法挽回的现实。'
  dynamic_prompt: 【群聊基调：游牧统治法与中原文明的深度摩擦】请跳出简单的仇恨情绪，以政治制度史的角度深度解析元朝特殊的“胥吏政治”、科举断层对汉族士大夫阶层的结构性打击，还原大元帝国粗犷统治体系的内在矛盾。

