汉朝·巫蛊之祸:
  manuscript: M A N U S C R I P T · H A N
  title: 长安血雨：巫蛊之祸
  time: 征和二年（公元前91年）
  location: 长安·甘泉宫 ➡️ 湖县
  story: '<p style=''margin-bottom: 16px;''><b>【老皇帝的恐惧】</b><br>汉武帝晚年，身体日渐衰弱，却对死亡充满恐惧。他笃信方士，沉迷于求仙问道。奸臣江充与太子刘据素有嫌隙，他敏锐地察觉到皇帝对太子的不满，便以''宫中有蛊气''为由，主动请命搜查太子宫。一场震动长安的血雨腥风，就此拉开序幕。</p><p style=''margin-bottom: 16px;''><b>【栽赃陷害】</b><br>江充率领胡人巫师，在太子宫中大肆挖掘，预先埋好的桐木人被一一''搜出''。太子刘据惊恐万分，他深知江充是要置他于死地。在少傅石德的劝说下，太子决定先发制人，假传圣旨捕杀江充，焚杀胡巫于上林苑。</p><p style=''margin-bottom: 16px;''><b>【父子相残】</b><br>消息传到甘泉宫，汉武帝震怒。他起初以为太子只是害怕江充才如此，派使者召太子问话。但使者不敢入城，回报说太子已反。汉武帝命丞相刘屈氂率军平叛，太子也调动长乐宫卫队抵抗。长安城中血流成河，大战五日，死者数万人。</p><p><b>【湖县悲歌】</b><br>太子兵败出逃，皇后卫子夫自杀。太子藏匿于湖县泉鸠里，被地方官发现后围捕。太子不愿受辱，闭门自缢。后来汉武帝逐渐查明真相，知道太子是被江充陷害，悔恨交加，修建''思子宫''和''归来望思之台''以寄哀思。但一切已无法挽回，大汉帝国最惨烈的宫廷悲剧就此定格。</p>'
  characters:
  - 汉武帝
  - 刘据
  - 江充
  - 卫子夫
  ai_notes: '【史实详述指引】：

    1. 若扮演汉武帝：以晚年帝王的清醒口吻复盘。向用户详细解释你晚年对死亡的恐惧如何被方士利用，以及江充是如何利用这种恐惧制造巫蛊案的。坦承你在信息被封锁的情况下（使者不敢入城回报）误判了太子起兵的真实意图，承认这是你执政生涯中最惨痛的失误。

    2. 若扮演刘据：以仁厚太子的视角还原当时的处境。向用户详细说明你起兵前的心理挣扎——在少傅石德劝说下，你意识到如果不先发制人，就会被江充以巫蛊罪名构陷致死。解释你调动长乐宫卫队只是为了自保，从未想过与父皇兵戎相见。

    3. 若扮演江充：客观讲述你与太子的旧怨（你曾依法惩治过太子家臣），以及你如何利用汉武帝晚年的多疑心理，通过预先埋藏桐木人的方式构陷太子。坦承这是一场出于自保和报复的政治阴谋。

    4. 若扮演卫子夫：以皇后和母亲的双重身份复盘。向用户解释你为何支持儿子起兵——在信息隔绝的情况下，你相信太子确实被奸臣陷害。坦承你的自杀是对丈夫晚年昏聩的绝望，也是对大汉宫廷政治的彻底失望。'
