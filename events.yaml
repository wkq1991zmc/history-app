  story: '<p style=''margin-bottom: 16px;''><b>【寒门崛起】</b><br>与东晋历代依靠门阀世族不同，<b>刘裕</b>出身寒微，仅凭在北府兵中一刀一枪的赫赫战功，逐步掌握了南朝大权。为了积累代晋自立的绝对政治资本，更是为了恢复中原，他毅然发动了南朝历史上规模最大、战果最辉煌的两次北伐。</p><p style=''margin-bottom: 16px;''><b>【却月破敌】</b><br>在攻灭南燕后，刘裕挥师北伐后秦。面对北魏重装骑兵在黄河沿岸的袭扰，刘裕创下了古代战争史上的奇迹——却月阵。他以水军大船为依托，在岸边布下半月形步兵阵地，利用强弩和长矛，以步兵大规模击碎了北方游牧重骑兵的冲锋，威震天下。</p><p style=''margin-bottom: 16px;''><b>【收复两京】</b><br>义熙十三年，刘裕麾下猛将<b>王镇恶</b>率水军溯渭水直抵长安城下，后秦皇帝姚泓出降。至此，百年未被汉人统治的洛阳、长安重回南朝版图，黄河以南悉数收复。辛弃疾后世赞其：“金戈铁马，气吞万里如虎。”</p><p><b>【匆匆南归】</b><br>就在刘裕准备经略关中、继续扫平西北之时，留守建康的头号心腹刘穆之突然病逝。刘裕深恐后方生变，夺权代晋的大业受挫，只得留下年仅十一岁的次子刘义真与王镇恶等将领留守长安，自己匆匆南归。不久，留守将领内讧，王镇恶遇害，长安再次失陷。</p>'
