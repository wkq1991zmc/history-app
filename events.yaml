宋朝·澶渊之盟:
  manuscript: M A N U S C R I P T · S O N G
  title: 城下之盟：三十万的和平
  time: 景德元年（公元1004年）
  location: 澶州（今河南濮阳）
  story: '<p style=''margin-bottom: 16px;''><b>【辽军南下】</b><br>景德元年秋，辽国萧太后与辽圣宗亲率二十万大军南下攻宋，直逼黄河岸边的澶州。消息传到汴京，朝野震动。参知政事王钦若主张迁都金陵，签书枢密院事陈尧叟主张逃往蜀地。唯有宰相寇准力排众议，坚决请求宋真宗亲征澶州，以振士气。</p><p style=''margin-bottom: 16px;''><b>【真宗渡河】</b><br>宋真宗赵恒虽内心恐惧，但在寇准的坚持下勉强北上。当皇帝的黄龙旗在澶州城头升起时，宋军将士欢呼声震天动地，士气大振。宋军在澶州城下以床子弩射杀辽军主将萧挞凛，辽军受挫，双方陷入僵持。</p><p style=''margin-bottom: 16px;''><b>【和谈背后】</b><br>然而，宋真宗本无抗敌决心，一心只想议和。他私下派使臣与辽国谈判，甚至不顾前线将士的反对，答应了辽国的条件：宋每年向辽提供银十万两、绢二十万匹，史称''岁币''。寇准本想趁胜收复燕云十六州，却被真宗否决。</p><p><b>【百年和平】</b><br>澶渊之盟签订后，宋辽之间维持了长达百年的和平局面。虽然宋朝以屈辱的''岁币''换取和平，但相比战争的巨大消耗，这笔开支反而更为经济。然而，这也开创了宋朝以金钱换和平的先例，为日后的靖康之耻埋下了伏笔。寇准因功高震主，不久后被罢相贬谪。</p>'
  characters:
  - 宋真宗
  - 寇准
  - 萧太后
  ai_notes: '【史实详述指引】：

    1. 若扮演宋真宗：向用户坦诚你对战争的厌恶和财政算账的逻辑。详细说明三十万岁币（银、绢）在当时大宋庞大岁入中的极小比例，解释为什么用这点钱换取不用维持庞大北方军费开支，在你看来是一笔划算的''国家账目''。

    2. 若扮演寇准：向用户复盘当时的军事优势。解释床子弩射杀萧挞凛对辽军士气造成的毁灭性打击，以及你为何认为当时是收复燕云十六州的绝佳战机，痛陈大宋在军事体制上''将从中御''的软弱性。

    3. 若扮演萧太后：以极高的战略眼光回答。向用户说明辽国当时的内部隐患和孤军深入的风险。解释你为何要在主将阵亡的劣势下迅速促成和谈，以及岁币对维持辽国草原经济的重要意义。'
